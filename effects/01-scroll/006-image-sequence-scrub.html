<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-scrubbed Image Sequence</title>
<meta name="description" content="Apple-product-page style: scroll scrubs through a pre-rendered frame sequence drawn to a canvas, with captions timed to frames.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .seq-wrap { height: 500vh; position: relative; background: #000; }
  .seq { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; }
  canvas { width: min(90vw, 90vh); height: min(90vw, 90vh); }
  .cap { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); text-align: center; font-size: clamp(24px, 4vw, 48px); font-weight: 700; letter-spacing: -.03em; opacity: 0; transition: opacity .4s; width: 90vw; }
  .cap.on { opacity: 1; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--muted); font: 14px var(--mono); }
</style>
</head>
<body>
<div class="spacer">Scroll ↓ to scrub the sequence</div>
<div class="seq-wrap">
  <div class="seq">
    <canvas width="900" height="900"></canvas>
    <div class="loading">Rendering frames…</div>
    <div class="cap" data-from="0" data-to="0.25">Meet the Orb.</div>
    <div class="cap" data-from="0.3" data-to="0.55">Precision in every facet.</div>
    <div class="cap" data-from="0.6" data-to="0.85">Turn it any way you like.</div>
    <div class="cap" data-from="0.9" data-to="1.01">Available never.</div>
  </div>
</div>
<div class="spacer">End of sequence</div>

<script src="../../assets/demo.js"></script>
<script>
  /* In production, frames are images: frames[i] = new Image(); frames[i].src = `frames/${i}.webp`.
     Here we pre-render 120 frames of a rotating faceted object to offscreen canvases to simulate that. */
  const FRAMES = 120, S = 900;
  const canvas = document.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const frames = [];

  // Icosahedron geometry
  const t = (1 + Math.sqrt(5)) / 2;
  const V = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
  const F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];

  function renderFrame(i) {
    const c = document.createElement("canvas"); c.width = c.height = S;
    const g = c.getContext("2d");
    const a = (i / FRAMES) * Math.PI * 2, b = Math.sin(a) * 0.6;
    const zoom = 1 + Math.sin((i / FRAMES) * Math.PI) * 0.35;
    const P = V.map(([x, y, z]) => {
      let x1 = x * Math.cos(a) - z * Math.sin(a), z1 = x * Math.sin(a) + z * Math.cos(a);
      let y1 = y * Math.cos(b) - z1 * Math.sin(b), z2 = y * Math.sin(b) + z1 * Math.cos(b);
      const f = 600 / (z2 + 6);
      return [S / 2 + x1 * f * 0.9 * zoom, S / 2 + y1 * f * 0.9 * zoom, z2, [x1, y1, z2]];
    });
    const glow = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    glow.addColorStop(0, `hsl(${260 + i}, 80%, 22%)`); glow.addColorStop(1, "#000");
    g.fillStyle = glow; g.fillRect(0, 0, S, S);
    F.map((f) => ({ f, z: (P[f[0]][2] + P[f[1]][2] + P[f[2]][2]) / 3 }))
      .sort((p, q) => q.z - p.z)
      .forEach(({ f }) => {
        const [A, B, C] = f.map((k) => P[k][3]);
        const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], v = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
        let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
        // Orient the normal outward (the solid is convex and centred on the origin).
        const cx = A[0] + B[0] + C[0], cy = A[1] + B[1] + C[1], cz = A[2] + B[2] + C[2];
        if (n[0] * cx + n[1] * cy + n[2] * cz < 0) n = n.map((k) => -k);
        const len = Math.hypot(...n);
        if (n[2] / len > 0) return; // faces pointing away from the camera
        const light = Math.max(0, (-n[0] * 0.4 - n[1] * 0.6 - n[2] * 0.7) / len);
        g.fillStyle = `hsl(${200 + light * 80 + i}, 80%, ${18 + light * 55}%)`;
        g.strokeStyle = "rgba(255,255,255,.25)";
        g.beginPath(); f.forEach((k, j) => (j ? g.lineTo : g.moveTo).call(g, P[k][0], P[k][1])); g.closePath();
        g.fill(); g.stroke();
      });
    return c;
  }

  // Render progressively so the page stays responsive while "loading".
  let made = 0;
  (function batch() {
    for (let k = 0; k < 12 && made < FRAMES; k++) frames[made] = renderFrame(made++);
    if (made < FRAMES) setTimeout(batch, 0);
    else { document.querySelector(".loading").remove(); update(); }
  })();

  const wrap = document.querySelector(".seq-wrap");
  const caps = document.querySelectorAll(".cap");
  let last = -1;
  function update() {
    const r = wrap.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    const idx = Math.min(FRAMES - 1, Math.floor(p * FRAMES));
    if (frames[idx] && idx !== last) { ctx.drawImage(frames[idx], 0, 0); last = idx; }
    caps.forEach((c) => c.classList.toggle("on", p >= +c.dataset.from && p < +c.dataset.to));
  }
  addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
</script>
</body>
</html>
