<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoom Through Text</title>
<meta name="description" content="Scrolling flies the camera into a giant word until a letter fills the screen and reveals the image inside it.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .zoom-wrap { height: 400vh; position: relative; }
  .zoom-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .zoom-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  /* White layer with black text, blended with screen: the image shows only through the letters. */
  .zoom-mask { position: absolute; inset: 0; background: #fff; mix-blend-mode: screen; display: grid; place-items: center; }
  .zoom-mask h2 { margin: 0; color: #000; font-size: clamp(80px, 22vw, 360px); font-weight: 900; letter-spacing: -.06em; line-height: 1; will-change: transform; white-space: nowrap; }
  .zoom-caption { position: absolute; left: 0; right: 0; bottom: 10vh; text-align: center; font-size: 22px; color: #fff; opacity: 0; text-shadow: 0 2px 20px #000; }
</style>
</head>
<body>
<div class="spacer">Scroll ↓ to dive in</div>
<div class="zoom-wrap">
  <div class="zoom-sticky">
    <div class="zoom-bg"></div>
    <div class="zoom-mask"><h2>D<span class="pivot">I</span>VE</h2></div>
    <div class="zoom-caption">You're inside the letter now.</div>
  </div>
</div>
<div class="spacer">Surfaced</div>

<script src="../../assets/demo.js"></script>
<script>
  document.querySelector(".zoom-bg").style.backgroundImage = `url(${Demo.artURL(1600, 1000, 1)})`;
  const wrap = document.querySelector(".zoom-wrap");
  const title = document.querySelector(".zoom-mask h2");
  const pivot = document.querySelector(".pivot");
  const mask = document.querySelector(".zoom-mask");
  const cap = document.querySelector(".zoom-caption");

  // Zoom into the vertical stroke of the "I" so the image fills the screen.
  function setOrigin() {
    title.style.transform = "none";
    const tr = title.getBoundingClientRect(), pr = pivot.getBoundingClientRect();
    title.style.transformOrigin = `${pr.left + pr.width / 2 - tr.left}px ${pr.top + pr.height * 0.5 - tr.top}px`;
    update();
  }
  function update() {
    const r = wrap.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    const scale = Math.pow(120, Math.min(1, p / 0.8));   // exponential feels like constant speed
    title.style.transform = `scale(${scale})`;
    mask.style.opacity = p > 0.85 ? 1 - (p - 0.85) / 0.15 : 1;
    cap.style.opacity = Math.max(0, (p - 0.75) / 0.2);
  }
  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", setOrigin);
  document.fonts.ready.then(setOrigin);
  setOrigin();
</script>
</body>
</html>
