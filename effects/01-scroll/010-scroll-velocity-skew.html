<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll Velocity Skew</title>
<meta name="description" content="Content leans and stretches in proportion to how fast you scroll, then springs back upright.">
<meta name="tech" content="JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .skew-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; padding: 100px 16px; }
  .skew-grid .item { aspect-ratio: 3/4; border-radius: 18px; background-size: cover; background-position: center; will-change: transform; }
  h1 { text-align: center; font-size: clamp(40px, 8vw, 110px); letter-spacing: -.05em; margin: 120px 0 0; will-change: transform; }
</style>
</head>
<body>
<h1 class="skew">Scroll fast</h1>
<div class="skew-grid"></div>

<script src="../../assets/demo.js"></script>
<script>
  const grid = document.querySelector(".skew-grid");
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("div");
    d.className = "item skew";
    d.style.backgroundImage = `url(${Demo.artURL(400, 530, i)})`;
    grid.appendChild(d);
  }
  const targets = document.querySelectorAll(".skew");
  let last = scrollY, skew = 0;
  function frame() {
    const v = scrollY - last; last = scrollY;
    // Ease toward the velocity-derived skew, clamped so it never gets silly.
    const goal = Math.max(-12, Math.min(12, v * 0.35));
    skew += (goal - skew) * 0.12;
    const t = `skewY(${skew.toFixed(2)}deg) scaleY(${(1 + Math.abs(skew) * 0.006).toFixed(4)})`;
    targets.forEach((el) => (el.style.transform = t));
    requestAnimationFrame(frame);
  }
  if (!Demo.reduced) requestAnimationFrame(frame);
</script>
</body>
</html>
