<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snapped Full-page Sections</title>
<meta name="description" content="CSS scroll-snap full-screen sections with animated content entrances and a clickable dot navigation.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  html { scroll-snap-type: y mandatory; }
  .snap { height: 100vh; scroll-snap-align: start; display: grid; place-items: center; text-align: center; padding: 16px; position: relative; overflow: hidden; }
  .snap h2 { font-size: clamp(48px, 10vw, 150px); margin: 0; letter-spacing: -.06em; line-height: .9; }
  .snap p { color: rgb(255 255 255 / .8); font-size: 20px; }
  .snap .content > * { opacity: 0; transform: translateY(60px); transition: opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .snap .content > :nth-child(2) { transition-delay: .12s; }
  .snap.visible .content > * { opacity: 1; transform: none; }
  .snap .shape { position: absolute; width: 50vmin; height: 50vmin; border-radius: 42% 58% 60% 40%; filter: blur(40px); opacity: .55; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); transform: scale(.4) rotate(-40deg); }
  .snap.visible .shape { transform: scale(1) rotate(0); }
  .dots { position: fixed; right: 20px; top: 50%; transform: translateY(-50%); display: grid; gap: 12px; z-index: 10; }
  .dots button { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; background: transparent; padding: 0; cursor: pointer; transition: all .3s; }
  .dots button[aria-current="true"] { background: #fff; transform: scale(1.3); }
  @media (prefers-reduced-motion: reduce) { html { scroll-snap-type: none; } .snap .content > * { opacity: 1; transform: none; } }
</style>
</head>
<body>
<nav class="dots" aria-label="Sections"></nav>
<main></main>

<script src="../../assets/demo.js"></script>
<script>
  const data = [["Snap", "#1e1b4b", "#a78bfa"], ["Every", "#082f49", "#22d3ee"], ["Section", "#431407", "#fb923c"], ["Lands", "#052e16", "#4ade80"], ["Perfectly", "#4a044e", "#f472b6"]];
  const main = document.querySelector("main"), dots = document.querySelector(".dots");
  data.forEach(([t, bg, c], i) => {
    main.insertAdjacentHTML("beforeend", `<section class="snap" id="s${i}" style="background:${bg}"><div class="shape" style="background:${c}"></div><div class="content"><h2>${t}</h2><p>Section ${i + 1} of ${data.length}</p></div></section>`);
    const b = document.createElement("button");
    b.setAttribute("aria-label", "Go to section " + (i + 1));
    b.onclick = () => document.getElementById("s" + i).scrollIntoView({ behavior: Demo.reduced ? "auto" : "smooth" });
    dots.appendChild(b);
  });
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    e.target.classList.toggle("visible", e.isIntersecting);
    if (e.isIntersecting) [...dots.children].forEach((d, i) => d.setAttribute("aria-current", "s" + i === e.target.id));
  }), { threshold: 0.6 });
  document.querySelectorAll(".snap").forEach((s) => io.observe(s));
</script>
</body>
</html>
