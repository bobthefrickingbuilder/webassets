<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-drawn SVG Path</title>
<meta name="description" content="A winding line draws itself down the page as you scroll, with a glowing marker riding the tip and milestones lighting up as it passes.">
<meta name="tech" content="SVG, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .path-wrap { position: relative; height: 400vh; max-width: 1000px; margin: 0 auto; }
  .path-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .track { fill: none; stroke: rgb(255 255 255 / .08); stroke-width: 6; }
  .line { fill: none; stroke: url(#g); stroke-width: 6; stroke-linecap: round; }
  .tip { fill: #fff; filter: drop-shadow(0 0 10px var(--accent-2)); }
  .ms { position: absolute; width: 220px; transform: translate(-50%, -50%); text-align: center; opacity: .2; transition: opacity .5s, transform .5s; }
  .ms.on { opacity: 1; transform: translate(-50%, -60%); }
  .ms b { display: block; font-size: 28px; letter-spacing: -.02em; }
  .ms span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="spacer">Scroll ↓ and follow the line</div>
<div class="path-wrap">
  <svg viewBox="0 0 1000 4000" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
    <path class="track" d="M500 0 C 500 300, 150 350, 150 700 S 850 1100, 850 1500 S 150 1900, 150 2300 S 850 2700, 850 3100 S 500 3600, 500 4000"/>
    <path class="line"  d="M500 0 C 500 300, 150 350, 150 700 S 850 1100, 850 1500 S 150 1900, 150 2300 S 850 2700, 850 3100 S 500 3600, 500 4000"/>
    <circle class="tip" r="9"/>
  </svg>
</div>
<div class="spacer">Arrived</div>

<script src="../../assets/demo.js"></script>
<script>
  const wrap = document.querySelector(".path-wrap");
  const line = document.querySelector(".line");
  const tip = document.querySelector(".tip");
  const len = line.getTotalLength();
  line.style.strokeDasharray = len;
  // Milestones placed at points along the path (as fractions of its length).
  const stones = [[0.17, "Start", "The line begins"], [0.37, "Turn", "Curves are cubic Béziers"], [0.57, "Cross", "dashoffset = length × (1 − p)"], [0.77, "Climb", "getPointAtLength() finds the tip"], [0.95, "Finish", "That's the whole trick"]];
  const els = stones.map(([f, t, s]) => {
    const pt = line.getPointAtLength(f * len);
    const d = document.createElement("div");
    d.className = "ms";
    d.style.left = (pt.x / 10) + "%"; d.style.top = (pt.y / 40) + "%";
    d.innerHTML = `<b>${t}</b><span>${s}</span>`;
    wrap.appendChild(d);
    return { d, f };
  });
  function update() {
    const r = wrap.getBoundingClientRect();
    // The tip tracks the middle of the viewport.
    const p = Math.min(1, Math.max(0, (innerHeight * 0.5 - r.top) / r.height));
    line.style.strokeDashoffset = len * (1 - p);
    const pt = line.getPointAtLength(p * len);
    tip.setAttribute("cx", pt.x); tip.setAttribute("cy", pt.y);
    els.forEach(({ d, f }) => d.classList.toggle("on", p >= f - 0.02));
  }
  addEventListener("scroll", update, { passive: true });
  update();
</script>
</body>
</html>
