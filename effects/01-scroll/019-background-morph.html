<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section Background Morphing</title>
<meta name="description" content="The page background and text color blend continuously between each section's theme as you scroll.">
<meta name="tech" content="JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { transition: none; }
  .theme { min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center; }
  .theme h2 { font-size: clamp(48px, 9vw, 130px); margin: 0; letter-spacing: -.05em; }
  .theme p { opacity: .7; font-size: 18px; }
</style>
</head>
<body>
<section class="theme" data-bg="#0b0c10" data-fg="#eef0f6"><div><h2>Midnight</h2><p>data-bg / data-fg on each section</p></div></section>
<section class="theme" data-bg="#fde68a" data-fg="#1c1917"><div><h2>Butter</h2><p>Colors blend by scroll position</p></div></section>
<section class="theme" data-bg="#be123c" data-fg="#fff1f2"><div><h2>Crimson</h2><p>No hard cuts</p></div></section>
<section class="theme" data-bg="#d1fae5" data-fg="#064e3b"><div><h2>Mint</h2><p>Works with any number of sections</p></div></section>
<section class="theme" data-bg="#1e1b4b" data-fg="#c7d2fe"><div><h2>Indigo</h2><p>Fin.</p></div></section>

<script src="../../assets/demo.js"></script>
<script>
  const secs = [...document.querySelectorAll(".theme")];
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const themes = secs.map((s) => ({ bg: hex(s.dataset.bg), fg: hex(s.dataset.fg) }));
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
  function update() {
    // Which pair of sections straddles the viewport centre, and how far between them are we?
    const mid = scrollY + innerHeight / 2;
    let i = 0;
    while (i < secs.length - 1 && secs[i + 1].offsetTop + secs[i + 1].offsetHeight / 2 < mid) i++;
    const a = secs[i], b = secs[Math.min(i + 1, secs.length - 1)];
    const ca = a.offsetTop + a.offsetHeight / 2, cb = b.offsetTop + b.offsetHeight / 2;
    const t = cb === ca ? 0 : Math.min(1, Math.max(0, (mid - ca) / (cb - ca)));
    const s = t * t * (3 - 2 * t);
    document.body.style.background = mix(themes[i].bg, themes[Math.min(i + 1, secs.length - 1)].bg, s);
    document.body.style.color = mix(themes[i].fg, themes[Math.min(i + 1, secs.length - 1)].fg, s);
  }
  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
  update();
</script>
</body>
</html>
