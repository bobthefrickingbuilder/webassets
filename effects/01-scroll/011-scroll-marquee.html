<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-reactive Marquee</title>
<meta name="description" content="Infinite marquee rows that speed up with scroll velocity and reverse direction when you scroll back up.">
<meta name="tech" content="JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .marquee { overflow: hidden; white-space: nowrap; padding: 2vh 0; border-block: 1px solid var(--line); }
  .marquee .inner { display: inline-flex; will-change: transform; }
  .marquee span { font-size: clamp(48px, 9vw, 140px); font-weight: 800; letter-spacing: -.04em; padding-right: .5em; }
  .marquee.alt span { -webkit-text-stroke: 2px var(--fg); color: transparent; }
  .marquee span i { font-style: normal; color: var(--accent); }
  .mq-wrap { min-height: 220vh; display: grid; align-content: center; gap: 4vh; }
</style>
</head>
<body>
<div class="mq-wrap">
  <div class="marquee" data-speed="1"><div class="inner"><span>Motion <i>✦</i> Rhythm <i>✦</i> Flow <i>✦</i></span></div></div>
  <div class="marquee alt" data-speed="-1.3"><div class="inner"><span>Scroll to steer <i>✦</i> </span></div></div>
  <div class="marquee" data-speed="0.7"><div class="inner"><span>Faster <i>→</i> Slower <i>←</i> </span></div></div>
</div>

<script src="../../assets/demo.js"></script>
<script>
  /* Each row's content is duplicated until it covers 2× the viewport so the loop is seamless.
     x wraps by one content width; scroll velocity adds speed and sets the direction. */
  const rows = [...document.querySelectorAll(".marquee")].map((m) => {
    const inner = m.querySelector(".inner");
    const unit = inner.firstElementChild;
    while (inner.scrollWidth < innerWidth * 2 + unit.offsetWidth) inner.appendChild(unit.cloneNode(true));
    return { inner, w: unit.offsetWidth, speed: parseFloat(m.dataset.speed), x: 0 };
  });
  let last = scrollY, dir = 1, boost = 0;
  function frame() {
    const v = scrollY - last; last = scrollY;
    if (v !== 0) dir = Math.sign(v);
    boost += (Math.abs(v) * 0.6 - boost) * 0.1;
    for (const r of rows) {
      r.x -= (1.2 + boost) * r.speed * dir;
      r.x = ((r.x % r.w) - r.w) % r.w;   // keep within (-w, 0]
      r.inner.style.transform = `translate3d(${r.x}px,0,0)`;
    }
    requestAnimationFrame(frame);
  }
  if (!Demo.reduced) requestAnimationFrame(frame);
</script>
</body>
</html>
