<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline-to-Fill Hover</title>
<meta name="description" content="Big outlined menu items fill with solid colour on hover via a clip-path sweep, from the side the pointer entered.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .menu a { position: relative; display: block; font: 900 clamp(48px, 10vw, 130px)/1 var(--font); letter-spacing: -.04em; text-transform: uppercase; text-decoration: none;
            color: transparent; -webkit-text-stroke: 1.5px rgb(255 255 255 / .6); }
  .menu a::after { content: attr(data-text); position: absolute; inset: 0; color: var(--c, var(--accent)); -webkit-text-stroke: 0;
                   clip-path: inset(0 100% 0 0); transition: clip-path .5s cubic-bezier(.7,0,.2,1); }
  .menu a.from-right::after { clip-path: inset(0 0 0 100%); }
  .menu a:hover::after, .menu a:focus-visible::after { clip-path: inset(0 0 0 0); }
</style>
</head>
<body>
<main class="center">
  <ul class="menu">
    <li><a href="#" data-text="Studio" style="--c:#a78bfa">Studio</a></li>
    <li><a href="#" data-text="Projects" style="--c:#22d3ee">Projects</a></li>
    <li><a href="#" data-text="Culture" style="--c:#f472b6">Culture</a></li>
    <li><a href="#" data-text="Contact" style="--c:#facc15">Contact</a></li>
  </ul>
</main>

<script src="../../assets/demo.js"></script>
<script>
  // Fill from whichever side the pointer came in.
  document.querySelectorAll(".menu a").forEach((a) => {
    a.addEventListener("pointerenter", (e) => {
      const r = a.getBoundingClientRect();
      a.classList.toggle("from-right", e.clientX > r.left + r.width / 2);
    });
    a.addEventListener("click", (e) => e.preventDefault());
  });
</script>
</body>
</html>
