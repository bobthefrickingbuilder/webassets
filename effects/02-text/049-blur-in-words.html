<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blur-in Word Reveal</title>
<meta name="description" content="Keynote-style reveal: words sharpen from a soft blur and drift up into place one after another.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .blur-in { font-size: clamp(36px, 6.5vw, 92px); font-weight: 600; letter-spacing: -.04em; line-height: 1.08; max-width: 14ch; text-align: center; margin: 0; }
  .blur-in .w { display: inline-block; opacity: 0; filter: blur(16px); transform: translateY(.3em); animation: sharpen 1.1s cubic-bezier(.2,.65,.3,1) forwards; animation-delay: calc(var(--i) * 110ms); }
  @keyframes sharpen { to { opacity: 1; filter: blur(0); transform: none; } }
  .sub { color: var(--muted); font-size: 20px; text-align: center; max-width: 40ch; margin: 0; }
  .sub .w { animation-duration: .8s; animation-delay: calc(1.2s + var(--i) * 40ms); }
  button { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .blur-in .w { animation: none; opacity: 1; filter: none; transform: none; } }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <h1 class="blur-in">The most powerful thing we've ever made.</h1>
  <p class="blur-in sub">Words sharpen one at a time with a short stagger, then the subtitle follows.</p>
  <button>Replay</button>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const els = document.querySelectorAll(".blur-in");
  const originals = [...els].map((el) => el.textContent);
  function split() {
    els.forEach((el, k) => {
      el.setAttribute("aria-label", originals[k]);
      el.innerHTML = originals[k].split(" ").map((w, i) => `<span class="w" aria-hidden="true" style="--i:${i}">${w}</span>`).join(" ");
    });
  }
  document.querySelector("button").onclick = split;   // re-creating the spans restarts the animation
  split();
</script>
</body>
</html>
