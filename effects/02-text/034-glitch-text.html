<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glitch Text</title>
<meta name="description" content="CSS glitch: RGB-split copies of the text jitter through random clip-path slices, with an intensity control and hover burst.">
<meta name="tech" content="CSS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  /* Usage: <h1 class="glitch" data-text="SAME TEXT">SAME TEXT</h1> */
  .glitch { position: relative; font: 900 clamp(56px, 12vw, 170px)/1 var(--font); letter-spacing: -.04em; margin: 0; color: #fff; --dur: 2.2s; }
  .glitch::before, .glitch::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; }
  .glitch::before { color: #0ff; transform: translate(-3px, 0); mix-blend-mode: screen; animation: slice-a var(--dur) infinite steps(1); }
  .glitch::after  { color: #f0f; transform: translate(3px, 0);  mix-blend-mode: screen; animation: slice-b calc(var(--dur) * .9) infinite steps(1); }
  .glitch:hover { --dur: .4s; }
  @keyframes slice-a {
    0%   { clip-path: inset(0 0 85% 0); transform: translate(-6px, -2px); }
    10%  { clip-path: inset(40% 0 43% 0); transform: translate(5px, 1px); }
    20%  { clip-path: inset(80% 0 2% 0); transform: translate(-4px, 2px); }
    30%  { clip-path: inset(10% 0 70% 0); transform: translate(3px, -1px); }
    40%  { clip-path: inset(55% 0 30% 0); transform: translate(-2px, 0); }
    50%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  }
  @keyframes slice-b {
    0%   { clip-path: inset(70% 0 10% 0); transform: translate(6px, 2px); }
    15%  { clip-path: inset(20% 0 60% 0); transform: translate(-5px, -1px); }
    25%  { clip-path: inset(50% 0 35% 0); transform: translate(4px, 0); }
    35%  { clip-path: inset(5% 0 88% 0); transform: translate(-3px, 1px); }
    45%, 100% { clip-path: inset(100% 0 0 0); transform: none; }
  }
  .glitch.small { font-size: 28px; font-family: var(--mono); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .glitch::before, .glitch::after { animation: none; display: none; } }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <h1 class="glitch" data-text="GLITCH">GLITCH</h1>
  <p class="glitch small" data-text="SYSTEM_FAILURE.exe">SYSTEM_FAILURE.exe</p>
  <p class="hint">Hover to increase the glitch rate.</p>
</div></main>
<script src="../../assets/demo.js"></script>
</body>
</html>
