<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shimmer Sweep Text</title>
<meta name="description" content="A bright band sweeps across muted text, like a loading shine or iOS 'slide to unlock', in pure CSS.">
<meta name="tech" content="CSS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .shimmer {
    --base: #5b6070; --shine: #ffffff;
    background: linear-gradient(110deg, var(--base) 35%, var(--shine) 50%, var(--base) 65%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 2.6s linear infinite;
  }
  @keyframes shine { from { background-position: 125% 0; } to { background-position: -125% 0; } }
  .big { font-size: clamp(40px, 8vw, 110px); font-weight: 800; letter-spacing: -.04em; margin: 0; }
  .unlock { font-size: 26px; font-weight: 500; --base: #6b7280; }
  .gold { --base: #92400e; --shine: #fde68a; font-size: 48px; font-weight: 800; }
  .pill { padding: 16px 28px; border-radius: 999px; background: #111318; border: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; color: var(--fg); } }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <h1 class="shimmer big">Shimmering headline</h1>
  <div class="pill"><span class="shimmer unlock">slide to unlock →</span></div>
  <span class="shimmer gold">PREMIUM</span>
</div></main>
<script src="../../assets/demo.js"></script>
</body>
</html>
