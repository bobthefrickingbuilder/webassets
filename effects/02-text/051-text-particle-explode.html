<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Explodes into Particles</title>
<meta name="description" content="Text is sampled into thousands of particles; click to blast them outward from the pointer and watch them reassemble. Type to change the word.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .ui { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px; }
  .ui input { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); font: inherit; width: 220px; }
</style>
</head>
<body>
<canvas aria-label="Particle text. Click to explode."></canvas>
<div class="ui"><input value="BOOM" maxlength="12" aria-label="Word to render"><span class="hint" style="align-self:center">Click anywhere</span></div>

<script src="../../assets/demo.js"></script>
<script>
  const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d");
  const input = document.querySelector("input");
  let W, H, dpr, particles = [];
  const mouse = { x: -1e4, y: -1e4 };

  // Draw the word offscreen, then create one particle per sampled opaque pixel.
  function build(word) {
    const off = document.createElement("canvas"); off.width = W; off.height = H;
    const g = off.getContext("2d");
    const size = Math.min(W / (word.length * 0.62), H * 0.5);
    g.font = `900 ${size}px system-ui, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#fff"; g.fillText(word, W / 2, H / 2);
    const data = g.getImageData(0, 0, W, H).data;
    const step = Math.max(3, Math.round(4 * dpr));
    const next = [];
    for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
      if (data[(y * W + x) * 4 + 3] > 128) next.push({ hx: x, hy: y, x: particles.length ? particles[next.length % particles.length].x : Math.random() * W, y: particles.length ? particles[next.length % particles.length].y : Math.random() * H, vx: 0, vy: 0, hue: 180 + (x / W) * 140 });
    }
    particles = next;
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
    build(input.value || " ");
  }
  function explode(x, y) {
    for (const p of particles) {
      const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) + 1;
      const f = (60 * dpr) / Math.sqrt(d) * (0.5 + Math.random());
      p.vx += (dx / d) * f; p.vy += (dy / d) * f;
    }
  }
  function frame() {
    ctx.fillStyle = "rgba(11,12,16,0.35)"; ctx.fillRect(0, 0, W, H);
    for (const p of particles) {
      // Gentle push from the hovering pointer, springs back to home.
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy, R = 90 * dpr;
      if (d2 < R * R) { const d = Math.sqrt(d2) + 0.01, f = (1 - d / R) * 3; p.vx += dx / d * f; p.vy += dy / d * f; }
      p.vx += (p.hx - p.x) * 0.012; p.vy += (p.hy - p.y) * 0.012;
      p.vx *= 0.9; p.vy *= 0.9;
      p.x += p.vx; p.y += p.vy;
      const speed = Math.min(1, Math.hypot(p.vx, p.vy) / 12);
      ctx.fillStyle = `hsl(${p.hue + speed * 60}, 90%, ${60 + speed * 30}%)`;
      ctx.fillRect(p.x, p.y, 2 * dpr, 2 * dpr);
    }
    requestAnimationFrame(frame);
  }
  canvas.addEventListener("pointerdown", (e) => explode(e.clientX * dpr, e.clientY * dpr));
  canvas.addEventListener("pointermove", (e) => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; });
  canvas.addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });
  input.addEventListener("input", () => build(input.value.toUpperCase() || " "));
  addEventListener("resize", resize);
  resize();
  if (Demo.reduced) particles.forEach((p) => { p.x = p.hx; p.y = p.hy; });
  requestAnimationFrame(frame);
</script>
</body>
</html>
