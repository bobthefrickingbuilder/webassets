<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy to Clipboard Button</title>
<meta name="description" content="A code block copy button whose clipboard icon morphs into a checkmark, with a small toast confirming the copy and a graceful fallback.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .code { position: relative; width: min(560px, 92vw); border-radius: 14px; background: #07080b; border: 1px solid var(--line); }
  .code pre { margin: 0; padding: 22px; font: 14px/1.6 var(--mono); color: #c9d1d9; overflow-x: auto; }
  .code .k { color: #ff7b72; } .code .s { color: #a5d6ff; } .code .f { color: #d2a8ff; }
  .copy { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #15171d; cursor: pointer; display: grid; place-items: center; }
  .copy svg { grid-area: 1 / 1; width: 18px; height: 18px; fill: none; stroke: #c9d1d9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s cubic-bezier(.2,1.6,.4,1), opacity .2s; }
  .copy .check { stroke: #4ade80; opacity: 0; transform: scale(.3) rotate(-30deg); }
  .copy.done .clip { opacity: 0; transform: scale(.3) rotate(30deg); }
  .copy.done .check { opacity: 1; transform: none; }
  .copy.done { border-color: #166534; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 40px); opacity: 0; padding: 10px 18px; border-radius: 10px; background: #f5f5f4; color: #111; font-weight: 600; font-size: 14px; transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s; pointer-events: none; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<main class="center">
  <div class="code">
    <pre><code><span class="k">const</span> fx = <span class="k">await</span> <span class="f">import</span>(<span class="s">"web-assets"</span>);
fx.<span class="f">scramble</span>(<span class="s">"#title"</span>, { speed: <span class="s">1.4</span> });</code></pre>
    <button class="copy" aria-label="Copy code">
      <svg class="clip" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <svg class="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
</main>
<div class="toast" role="status" aria-live="polite"></div>

<script src="../../assets/demo.js"></script>
<script>
  const btn = document.querySelector(".copy"), toast = document.querySelector(".toast");
  function notify(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(notify.t); notify.t = setTimeout(() => toast.classList.remove("show"), 1800); }
  btn.addEventListener("click", async () => {
    const text = document.querySelector(".code code").innerText;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // Fallback for insecure contexts: select the text so Ctrl/Cmd+C works.
      const range = document.createRange(); range.selectNodeContents(document.querySelector(".code code"));
      getSelection().removeAllRanges(); getSelection().addRange(range);
      notify("Selected. Press Ctrl/⌘ + C"); return;
    }
    btn.classList.add("done"); btn.setAttribute("aria-label", "Copied");
    notify("Copied to clipboard");
    setTimeout(() => { btn.classList.remove("done"); btn.setAttribute("aria-label", "Copy code"); }, 1800);
  });
</script>
</body>
</html>
