<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Star Rating</title>
<meta name="description" content="A radio-group star rating: stars preview on hover, pop in sequence when chosen, and a label describes the rating. Fully keyboard accessible.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 6px; border: 0; padding: 0; margin: 0; }
  .rating input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rating label { cursor: pointer; width: 46px; height: 46px; }
  .rating svg { width: 100%; height: 100%; fill: #262a36; transition: fill .2s, transform .2s; }
  /* row-reverse lets "~" target the stars visually to the left of the hovered/checked one */
  .rating label:hover svg, .rating label:hover ~ label svg { fill: #fcd34d; transform: scale(1.08); }
  .rating input:checked ~ label svg { fill: #f59e0b; }
  .rating:not(:hover) input:checked ~ label svg { animation: pop .45s cubic-bezier(.2,1.8,.4,1) both; animation-delay: calc(var(--n) * 60ms); }
  .rating input:focus-visible + label svg { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
  @keyframes pop { 0% { transform: scale(.4) rotate(-30deg); } 100% { transform: scale(1); } }
  .out { font-size: 18px; min-height: 1.5em; }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <fieldset class="rating"><legend class="hint" style="width:100%;margin-bottom:12px">How was your experience?</legend></fieldset>
  <div class="out" aria-live="polite"></div>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const words = ["Terrible", "Meh", "Okay", "Great", "Amazing!"];
  const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
  const fs = document.querySelector(".rating"), out = document.querySelector(".out");
  for (let i = 5; i >= 1; i--) {
    fs.insertAdjacentHTML("beforeend", `<input type="radio" name="r" id="r${i}" value="${i}"><label for="r${i}" style="--n:${i - 1}" title="${words[i - 1]}">${star}<span class="hint" style="position:absolute;width:1px;height:1px;overflow:hidden">${i} star${i > 1 ? "s" : ""}</span></label>`);
  }
  fs.addEventListener("change", (e) => {
    out.textContent = `${words[e.target.value - 1]} (${e.target.value}/5)`;
    // Restart the pop animation on each new choice.
    fs.querySelectorAll("svg").forEach((s) => { s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; });
  });
</script>
</body>
</html>
