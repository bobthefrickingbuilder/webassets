<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Like Heart Burst</title>
<meta name="description" content="Twitter-style like: the heart pops from a collapsing ring, a burst of coloured dots sprays outward and the count rolls up.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .like { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; color: var(--muted); font: 500 18px var(--font); padding: 0; }
  .like .icon { position: relative; width: 60px; height: 60px; display: grid; place-items: center; }
  .like svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; position: relative; z-index: 2; transition: transform .15s; }
  .like:hover svg { transform: scale(1.1); }
  .like .ring { position: absolute; width: 0; height: 0; border-radius: 50%; border: 0 solid #f43f5e; }
  .like .dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; opacity: 0; }
  .like.on { color: #f43f5e; }
  .like.on svg { fill: #f43f5e; stroke: #f43f5e; animation: pop .45s cubic-bezier(.2,1.6,.4,1) .15s both; }
  .like.on .ring { animation: ring .4s ease-out forwards; }
  .like.on .dot { animation: dot .7s cubic-bezier(.2,.8,.2,1) .18s forwards; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes ring { 0% { width: 0; height: 0; border-width: 20px; border-color: #e879f9; } 100% { width: 44px; height: 44px; border-width: 0; border-color: #f43f5e; } }
  @keyframes dot { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-34px) scale(.2); } }
  .count { display: inline-block; height: 1.2em; overflow: hidden; }
  .count span { display: block; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) { .like * { animation: none !important; } }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <button class="like" aria-pressed="false" aria-label="Like">
    <span class="icon"><span class="ring"></span><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8 3 4 6.9 4c2.2 0 3.6 1.2 5.1 3 1.5-1.8 2.9-3 5.1-3C21 4 23.1 8 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="count"><span>41</span><span>42</span></span>
  </button>
  <p class="hint">Click to like / unlike.</p>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const btn = document.querySelector(".like"), icon = btn.querySelector(".icon");
  const colors = ["#f43f5e", "#fb923c", "#facc15", "#4ade80", "#22d3ee", "#a78bfa", "#e879f9"];
  // 14 dots in two staggered rings.
  for (let i = 0; i < 14; i++) {
    const d = document.createElement("span");
    d.className = "dot";
    d.style.setProperty("--a", (i / 14) * 360 + (i % 2) * 12 + "deg");
    d.style.background = colors[i % colors.length];
    if (i % 2) d.style.animationDelay = ".24s";
    icon.appendChild(d);
  }
  const nums = btn.querySelectorAll(".count span");
  btn.addEventListener("click", () => {
    const on = !btn.classList.contains("on");
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on);
    nums.forEach((n) => (n.style.transform = on ? "translateY(-100%)" : ""));
  });
</script>
</body>
</html>
