<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabs with Sliding Indicator</title>
<meta name="description" content="Accessible tabs whose highlight pill glides and resizes to the active tab, with directional panel transitions and arrow-key navigation.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .tabs { width: min(640px, 92vw); }
  .tablist { position: relative; display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); width: fit-content; margin: 0 auto 24px; }
  .tablist button { position: relative; z-index: 1; padding: 10px 18px; border: 0; background: none; color: var(--muted); font: 500 15px var(--font); cursor: pointer; border-radius: 10px; transition: color .3s; }
  .tablist button[aria-selected="true"] { color: #0b0c10; }
  .tablist button:focus-visible { outline: 2px solid var(--accent-2); }
  .pill { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 10px; background: #fff; transition: transform .45s cubic-bezier(.3,1.3,.4,1), width .45s cubic-bezier(.3,1.3,.4,1); }
  .panels { position: relative; overflow: hidden; min-height: 180px; }
  .panel { padding: 28px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); }
  .panel[hidden] { display: none; }
  .panel.enter { animation: enter .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateX(calc(var(--dir) * 40px)); } }
  .panel h3 { margin: 0 0 8px; }
  .panel p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main class="center">
  <div class="tabs">
    <div class="tablist" role="tablist" aria-label="Plans"><span class="pill" aria-hidden="true"></span></div>
    <div class="panels"></div>
  </div>
</main>

<script src="../../assets/demo.js"></script>
<script>
  const data = [["Overview", "Everything at a glance."], ["Features", "All the good stuff, listed."], ["Pricing", "Fair and transparent."], ["FAQ", "Answers to common questions."]];
  const list = document.querySelector(".tablist"), panels = document.querySelector(".panels"), pill = list.querySelector(".pill");
  data.forEach(([t, d], i) => {
    list.insertAdjacentHTML("beforeend", `<button role="tab" id="t${i}" aria-controls="p${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${t}</button>`);
    panels.insertAdjacentHTML("beforeend", `<div class="panel" role="tabpanel" id="p${i}" aria-labelledby="t${i}" ${i ? "hidden" : ""}><h3>${t}</h3><p>${d} ${Demo.lorem(26, i)}</p></div>`);
  });
  const tabs = [...list.querySelectorAll("[role=tab]")];
  let current = 0;
  function movePill(el, instant) {
    if (instant) pill.style.transition = "none";
    pill.style.width = el.offsetWidth + "px"; pill.style.transform = `translateX(${el.offsetLeft}px)`;
    if (instant) { pill.getBoundingClientRect(); pill.style.transition = ""; }
  }
  function select(i, focus) {
    if (i === current) return;
    const dir = i > current ? 1 : -1;
    tabs.forEach((t, k) => { t.setAttribute("aria-selected", k === i); t.tabIndex = k === i ? 0 : -1; });
    const old = document.getElementById("p" + current), next = document.getElementById("p" + i);
    old.hidden = true; next.hidden = false;
    next.style.setProperty("--dir", dir); next.classList.remove("enter"); void next.offsetWidth; next.classList.add("enter");
    movePill(tabs[i]); current = i;
    if (focus) tabs[i].focus();
  }
  list.addEventListener("click", (e) => { const t = e.target.closest("[role=tab]"); if (t) select(tabs.indexOf(t)); });
  list.addEventListener("keydown", (e) => {
    const map = { ArrowRight: 1, ArrowLeft: -1 };
    if (map[e.key]) select((current + map[e.key] + tabs.length) % tabs.length, true);
    if (e.key === "Home") select(0, true); if (e.key === "End") select(tabs.length - 1, true);
  });
  addEventListener("resize", () => movePill(tabs[current], true));
  document.fonts.ready.then(() => movePill(tabs[0], true));
  movePill(tabs[0], true);
</script>
</body>
</html>
