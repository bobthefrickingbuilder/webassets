<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Checkboxes and Radios</title>
<meta name="description" content="Native inputs restyled with draw-on SVG checkmarks, a bouncy fill, a strike-through todo list and radio dots that jelly into place.">
<meta name="tech" content="CSS, SVG">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .group { display: grid; gap: 14px; padding: 24px 28px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--line); min-width: 260px; }
  .group h3 { margin: 0 0 4px; font-size: 14px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
  .chk { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 17px; }
  .chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chk .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #4b5068; display: grid; place-items: center; transition: background .25s, border-color .25s, transform .25s; flex: none; }
  .chk svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .35s .05s ease-out; }
  .chk input:checked + .box { background: var(--accent); border-color: var(--accent); animation: bounce .4s; }
  .chk input:checked + .box svg { stroke-dashoffset: 0; }
  .chk input:focus-visible + .box { outline: 2px solid var(--accent-2); outline-offset: 3px; }
  @keyframes bounce { 40% { transform: scale(.8); } 70% { transform: scale(1.15); } }
  /* Todo: label text gets struck through with an animated line */
  .todo .txt { position: relative; transition: color .3s; }
  .todo .txt::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 2px; background: var(--muted); transform: scaleX(0); transform-origin: left; transition: transform .35s .1s; }
  .todo input:checked ~ .txt { color: var(--muted); }
  .todo input:checked ~ .txt::after { transform: scaleX(1); }
  /* Radios */
  .rad .box { border-radius: 50%; }
  .rad .box::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; transform: scale(0); transition: transform .35s cubic-bezier(.2,1.8,.4,1); }
  .rad input:checked + .box { background: var(--accent-3); border-color: var(--accent-3); animation: none; }
  .rad input:checked + .box::after { transform: scale(1); }
  @media (prefers-reduced-motion: reduce) { .chk * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="center"><div class="row" style="align-items:flex-start">
  <fieldset class="group" style="border:1px solid var(--line)"><h3>Checkboxes</h3>
    <label class="chk"><input type="checkbox" checked><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span>Remember me</label>
    <label class="chk"><input type="checkbox"><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span>Email updates</label>
    <label class="chk"><input type="checkbox"><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span>Dark mode</label>
  </fieldset>
  <fieldset class="group" style="border:1px solid var(--line)"><h3>Todo</h3>
    <label class="chk todo"><input type="checkbox" checked><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span><span class="txt">Buy oat milk</span></label>
    <label class="chk todo"><input type="checkbox"><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span><span class="txt">Ship the release</span></label>
    <label class="chk todo"><input type="checkbox"><span class="box"><svg viewBox="0 0 14 14"><path d="M2 7.5l3.2 3L12 3.5"/></svg></span><span class="txt">Call grandma</span></label>
  </fieldset>
  <fieldset class="group" style="border:1px solid var(--line)"><h3>Radios</h3>
    <label class="chk rad"><input type="radio" name="plan" checked><span class="box"></span>Starter</label>
    <label class="chk rad"><input type="radio" name="plan"><span class="box"></span>Pro</label>
    <label class="chk rad"><input type="radio" name="plan"><span class="box"></span>Enterprise</label>
  </fieldset>
</div></main>
<script src="../../assets/demo.js"></script>
</body>
</html>
