<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expanding Panel Gallery</title>
<meta name="description" content="A row of slim image panels; the hovered or selected one expands with a flex-grow transition and reveals its caption. Stacks vertically on mobile.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .panels { display: flex; gap: 10px; width: min(1100px, 94vw); height: 70vh; }
  .panel { flex: 1; min-width: 0; position: relative; border: 0; padding: 0; border-radius: 22px; overflow: hidden; background-size: cover; background-position: center; cursor: pointer;
           transition: flex .7s cubic-bezier(.2,.8,.2,1); color: #fff; text-align: left; }
  .panel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgb(0 0 0 / .7)); }
  .panel .cap { position: absolute; left: 22px; right: 22px; bottom: 20px; z-index: 1; opacity: 0; transform: translateY(16px); transition: opacity .4s, transform .5s; white-space: nowrap; }
  .panel .cap h3 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .panel .cap p { margin: 4px 0 0; opacity: .8; }
  .panel .num { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 1; font: 600 13px var(--mono); }
  .panel[aria-expanded="true"] { flex: 5; }
  .panel[aria-expanded="true"] .cap { opacity: 1; transform: none; transition-delay: .25s; }
  .panel:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
  @media (max-width: 700px) { .panels { flex-direction: column; height: 80vh; } }
</style>
</head>
<body>
<main class="center"><div class="panels"></div></main>

<script src="../../assets/demo.js"></script>
<script>
  const host = document.querySelector(".panels");
  const items = [["Dunes", "Golden hour in the erg"], ["Tide", "Cold Atlantic light"], ["Ember", "A field after the fire"], ["Moss", "Rainforest floor"], ["Bloom", "Spring, briefly"], ["Night", "Somewhere north"]];
  items.forEach(([t, d], i) => host.insertAdjacentHTML("beforeend",
    `<button class="panel" aria-expanded="${i === 0}" style="background-image:url(${Demo.artURL(900, 900, i + 1)})"><span class="num">0${i + 1}</span><span class="cap"><h3>${t}</h3><p>${d}</p></span></button>`));
  const panels = [...host.children];
  const open = (p) => panels.forEach((x) => x.setAttribute("aria-expanded", x === p));
  panels.forEach((p) => { p.addEventListener("mouseenter", () => open(p)); p.addEventListener("focus", () => open(p)); p.addEventListener("click", () => open(p)); });
</script>
</body>
</html>
