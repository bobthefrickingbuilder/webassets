<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swipeable Card Stack</title>
<meta name="description" content="A Tinder-style deck: drag the top card, it tilts with the drag and shows LIKE / NOPE stamps; fling past the threshold to throw it away, otherwise it springs back.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .deck { position: relative; width: min(340px, 86vw); aspect-ratio: 3/4.2; }
  .sc { position: absolute; inset: 0; border-radius: 22px; background-size: cover; background-position: center; box-shadow: 0 20px 50px rgb(0 0 0 / .45); touch-action: none; user-select: none;
        display: flex; flex-direction: column; justify-content: flex-end; padding: 22px; color: #fff; cursor: grab; will-change: transform; }
  .sc::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(transparent 50%, rgb(0 0 0 / .7)); z-index: 0; }
  .sc > * { position: relative; z-index: 1; }
  .sc h3 { margin: 0; font-size: 28px; } .sc p { margin: 4px 0 0; opacity: .8; }
  .stamp { position: absolute; top: 28px; padding: 6px 14px; border: 4px solid; border-radius: 10px; font: 900 30px var(--font); letter-spacing: .05em; opacity: 0; z-index: 2; }
  .stamp.like { left: 22px; color: #4ade80; transform: rotate(-14deg); }
  .stamp.nope { right: 22px; color: #f87171; transform: rotate(14deg); }
  .actions { display: flex; gap: 20px; }
  .actions button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-2); font-size: 26px; cursor: pointer; transition: transform .2s; }
  .actions button:hover { transform: scale(1.1); }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 22px; }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <div class="deck"><div class="empty">No more cards · <button class="reset" style="background:none;border:0;color:var(--accent-2);cursor:pointer">reset</button></div></div>
  <div class="actions"><button class="no" aria-label="Nope">✕</button><button class="yes" aria-label="Like">♥</button></div>
  <p class="hint" aria-live="polite"></p>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const deck = document.querySelector(".deck"), status = document.querySelector("[aria-live]");
  const people = [["Juno", "Climber, 27"], ["Ade", "Chef, 31"], ["Mika", "Painter, 25"], ["Rui", "Pilot, 34"], ["Sam", "Coder, 29"], ["Lea", "Botanist, 30"]];
  let cards = [];
  function deal() {
    cards.forEach((c) => c.remove());
    cards = people.map(([n, d], i) => {
      const c = document.createElement("div"); c.className = "sc";
      c.style.backgroundImage = `url(${Demo.artURL(500, 700, i)})`;
      c.innerHTML = `<span class="stamp like">LIKE</span><span class="stamp nope">NOPE</span><h3>${n}</h3><p>${d}</p>`;
      deck.appendChild(c); return c;
    }).reverse();          // cards[0] is the top (last in DOM)
    layout();
  }
  function layout() {
    // Cards under the top one sit slightly smaller and lower, like a real pile.
    cards.forEach((c, k) => { c.style.transition = "transform .3s"; c.style.transform = `translateY(${k * 10}px) scale(${1 - k * 0.04})`; c.style.zIndex = 100 - k; });
    if (cards[0]) bind(cards[0]);
  }
  function throwCard(c, dir) {
    c.style.transition = "transform .45s cubic-bezier(.3,.6,.4,1), opacity .45s";
    c.style.transform = `translate(${dir * innerWidth}px, -60px) rotate(${dir * 40}deg)`;
    c.style.opacity = 0;
    status.textContent = `${dir > 0 ? "Liked" : "Passed on"} ${c.querySelector("h3").textContent}`;
    cards.shift(); setTimeout(() => c.remove(), 500); layout();
  }
  function bind(c) {
    let sx = 0, sy = 0, dx = 0, dy = 0, down = false;
    const like = c.querySelector(".like"), nope = c.querySelector(".nope");
    c.onpointerdown = (e) => { down = true; sx = e.clientX; sy = e.clientY; c.setPointerCapture(e.pointerId); c.style.transition = "none"; c.style.cursor = "grabbing"; };
    c.onpointermove = (e) => {
      if (!down) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      c.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.08}deg)`;
      like.style.opacity = Math.max(0, dx / 100); nope.style.opacity = Math.max(0, -dx / 100);
    };
    c.onpointerup = () => {
      if (!down) return; down = false; c.style.cursor = "";
      if (Math.abs(dx) > 110) throwCard(c, Math.sign(dx));
      else { c.style.transition = "transform .5s cubic-bezier(.2,1.6,.4,1)"; c.style.transform = ""; like.style.opacity = nope.style.opacity = 0; }
      dx = dy = 0;
    };
  }
  document.querySelector(".yes").onclick = () => cards[0] && throwCard(cards[0], 1);
  document.querySelector(".no").onclick = () => cards[0] && throwCard(cards[0], -1);
  document.querySelector(".reset").onclick = deal;
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight") document.querySelector(".yes").click(); if (e.key === "ArrowLeft") document.querySelector(".no").click(); });
  deal();
</script>
</body>
</html>
