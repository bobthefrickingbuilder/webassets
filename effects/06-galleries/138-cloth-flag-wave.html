<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waving Cloth Image</title>
<meta name="description" content="An image mapped onto a subdivided Three.js plane whose vertices ripple like a flag in the wind, with shading from the wave slope. Hover to gust; drag to orbit.">
<meta name="tech" content="WebGL, Three.js">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: linear-gradient(#0f172a, #1e293b); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
</style>
</head>
<body>
<canvas aria-label="An image waving like a flag. Hover to make it gust."></canvas>

<script src="../../assets/demo.js"></script>
<script src="../../assets/vendor/three/three.min.js"></script>
<script src="../../assets/three-kit.js"></script>
<script>
  const kit = ThreeKit.app({ position: [0, 0, 4.2], fov: 45, alpha: true });
  const controls = ThreeKit.orbit(kit.camera, kit.renderer.domElement, { minDistance: 2.5, maxDistance: 8 });
  const tex = new THREE.CanvasTexture(Demo.art(1024, 680, 3));
  // Raw ShaderMaterial output isn't colour-managed, so keep the texture unconverted too.
  tex.colorSpace = THREE.NoColorSpace;
  const uniforms = { uTime: { value: 0 }, uTex: { value: tex }, uGust: { value: 0 } };
  const mat = new THREE.ShaderMaterial({
    uniforms, side: THREE.DoubleSide,
    vertexShader: `
      uniform float uTime; uniform float uGust; varying vec2 vUv; varying float vShade;
      float wave(vec2 p){
        float a = 1. + uGust * 2.;
        // Amplitude grows toward the free edge (uv.x = 1), like cloth attached to a pole.
        return (sin(p.x * 4. - uTime * 3.) * .12 + sin(p.y * 3. + p.x * 2. - uTime * 2.2) * .06) * p.x * a;
      }
      void main(){
        vUv = uv;
        vec2 p = vec2(uv.x, uv.y);
        float z = wave(p);
        float zx = wave(p + vec2(.01, 0)) - z, zy = wave(p + vec2(0, .01)) - z;
        vShade = .75 + clamp((zx - zy) * 40., -.35, .35);
        vec3 pos = position + vec3(-z * .3, 0., z);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.);
      }`,
    fragmentShader: `uniform sampler2D uTex; varying vec2 vUv; varying float vShade;
      void main(){ vec4 c = texture2D(uTex, vUv); gl_FragColor = vec4(c.rgb * vShade, 1.); }`,
  });
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(3, 2, 80, 50), mat);
  kit.scene.add(flag);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.6, 16), new THREE.MeshBasicMaterial({ color: 0x94a3b8 }));
  pole.position.set(-1.53, -0.6, 0); kit.scene.add(pole);
  let gust = 0;
  kit.renderer.domElement.addEventListener("pointermove", () => (gust = 1));
  kit.onFrame((t, dt) => { uniforms.uTime.value = t; gust *= 0.97; uniforms.uGust.value += (gust - uniforms.uGust.value) * 0.05; controls.update(); }).start();
</script>
</body>
</html>
