<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coverflow Slider</title>
<meta name="description" content="Classic album coverflow: the centred cover faces you while neighbours angle away in 3D with reflections. Scroll, drag, click a cover, or use arrow keys.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .flow { position: relative; width: 100%; height: 420px; perspective: 1000px; touch-action: pan-y; user-select: none; }
  .cover { position: absolute; left: 50%; top: 40px; width: 240px; height: 240px; margin-left: -120px; border-radius: 8px; border: 0; padding: 0; cursor: pointer;
           background-size: cover; background-position: center; transition: transform .6s cubic-bezier(.2,.8,.2,1), filter .6s; -webkit-box-reflect: below 6px linear-gradient(transparent 60%, rgb(255 255 255 / .25)); }
  .title { text-align: center; min-height: 3em; }
  .title b { display: block; font-size: 22px; }
  .title span { color: var(--muted); }
</style>
</head>
<body>
<main class="center"><div class="stack" style="width:100%">
  <div class="flow" tabindex="0" aria-roledescription="carousel" aria-label="Albums"></div>
  <div class="title" aria-live="polite"><b></b><span></span></div>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const albums = [["Neon Tide", "The Cartographers"], ["Glass Hours", "Mira Sol"], ["Low Orbit", "Static Bloom"], ["Paper Suns", "Iron & Wine Bar"], ["Night Bus", "Tokyo Loops"], ["Fieldwork", "Ana Ferro"], ["Afterimage", "Velvet Index"], ["Quiet Riot", "No Static"], ["Salt Air", "Coastline"]];
  const flow = document.querySelector(".flow"), [tTitle, tArtist] = document.querySelectorAll(".title > *");
  const covers = albums.map(([t], i) => {
    const b = document.createElement("button"); b.className = "cover"; b.setAttribute("aria-label", t);
    b.style.backgroundImage = `url(${Demo.artURL(300, 300, i)})`;
    b.onclick = () => go(i); flow.appendChild(b); return b;
  });
  let cur = 4;
  function go(i) {
    cur = Math.max(0, Math.min(covers.length - 1, i));
    covers.forEach((c, k) => {
      const d = k - cur, s = Math.sign(d);
      // Centre faces forward; others step aside, turn 60° and sink back.
      c.style.transform = d === 0 ? "translateX(0) translateZ(80px)" : `translateX(${s * 150 + d * 60}px) translateZ(-80px) rotateY(${-s * 60}deg)`;
      c.style.zIndex = 100 - Math.abs(d);
      c.style.filter = `brightness(${d === 0 ? 1 : 0.6})`;
    });
    tTitle.textContent = albums[cur][0]; tArtist.textContent = albums[cur][1];
  }
  flow.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") go(cur - 1); if (e.key === "ArrowRight") go(cur + 1); });
  let acc = 0;
  flow.addEventListener("wheel", (e) => { e.preventDefault(); acc += e.deltaX || e.deltaY; if (Math.abs(acc) > 60) { go(cur + Math.sign(acc)); acc = 0; } }, { passive: false });
  let sx = null;
  flow.addEventListener("pointerdown", (e) => (sx = e.clientX));
  flow.addEventListener("pointerup", (e) => { if (sx !== null && Math.abs(e.clientX - sx) > 40) go(cur - Math.sign(e.clientX - sx) * Math.ceil(Math.abs(e.clientX - sx) / 120)); sx = null; });
  go(cur);
</script>
</body>
</html>
