<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-driven SVG Morph</title>
<meta name="description" content="A pinned shape morphs from blob to heart to star to droplet as you scroll, interpolating resampled outlines and colour in lockstep with the scroll position, with captions per stage.">
<meta name="tech" content="SVG, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .morph-wrap { height: 500vh; position: relative; }
  .morph-sticky { position: sticky; top: 0; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 6vw; gap: 4vw; }
  .morph-sticky svg { width: 100%; max-height: 70vh; overflow: visible; }
  .caps { position: relative; height: 200px; }
  .caps div { position: absolute; inset: 0; opacity: 0; transform: translateY(20px); transition: opacity .4s, transform .4s; }
  .caps div.on { opacity: 1; transform: none; }
  .caps h2 { font-size: clamp(36px, 5vw, 64px); letter-spacing: -.04em; margin: 0 0 8px; } .caps p { color: var(--muted); font-size: 18px; }
  @media (max-width: 760px) { .morph-sticky { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="spacer">Scroll ↓ to morph</div>
<div class="morph-wrap">
  <div class="morph-sticky">
    <svg viewBox="-120 -120 240 240" aria-hidden="true"><path class="shape"/></svg>
    <div class="caps"><div><h2>Blob</h2><p>Where every idea starts.</p></div><div><h2>Heart</h2><p>Then you start to care.</p></div><div><h2>Star</h2><p>It begins to shine.</p></div><div><h2>Drop</h2><p>And finally, it ships.</p></div></div>
  </div>
</div>
<div class="spacer">Fin.</div>

<script src="../../assets/demo.js"></script>
<script>
  const N = 90;
  // Each shape is defined as a radius function r(angle) so all of them share N points by construction.
  const shapes = [
    { col: [34, 211, 238], r: (a) => 90 + 10 * Math.sin(3 * a) + 8 * Math.cos(5 * a + 1) },
    { col: [244, 63, 94], pts: (t) => { const x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); return [x * 6, y * 6 - 10]; } },
    { col: [250, 204, 21], r: (a) => { const k = (a / (Math.PI * 2 / 5)) % 1; return 55 + 50 * Math.pow(Math.abs(Math.cos(k * Math.PI)), 3); } },
    { col: [124, 92, 255], pts: (t) => { const s = Math.sin(t), c = Math.cos(t); return [s * 70 * (1 - .35 * (1 - c) / 2), -c * 100 + (c < 0 ? 0 : 0) + 10 + Math.pow((1 + c) / 2, 3) * -10]; } },
  ];
  const sample = (s) => Array.from({ length: N }, (_, i) => {
    const t = (i / N) * Math.PI * 2;
    if (s.pts) return s.pts(t);
    const a = t - Math.PI / 2; return [Math.cos(a) * s.r(t), Math.sin(a) * s.r(t)];
  });
  const P = shapes.map(sample);
  const path = document.querySelector(".shape"), caps = document.querySelectorAll(".caps div"), wrap = document.querySelector(".morph-wrap");
  const ease = (t) => t * t * (3 - 2 * t);
  function update() {
    const r = wrap.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight))) * (P.length - 1);
    const i = Math.min(P.length - 2, Math.floor(p));
    // Hold each shape for the middle part of its segment, morph near the boundaries.
    const local = p - i, t = ease(Math.min(1, Math.max(0, (local - 0.25) / 0.5)));
    const a = P[i], b = P[i + 1];
    path.setAttribute("d", "M" + a.map((q, k) => `${(q[0] + (b[k][0] - q[0]) * t).toFixed(1)},${(q[1] + (b[k][1] - q[1]) * t).toFixed(1)}`).join("L") + "Z");
    const c = shapes[i].col.map((v, k) => Math.round(v + (shapes[i + 1].col[k] - v) * t));
    path.setAttribute("fill", `rgb(${c})`);
    const stage = Math.round(p);
    caps.forEach((el, k) => el.classList.toggle("on", k === stage));
  }
  addEventListener("scroll", update, { passive: true });
  update();
</script>
</body>
</html>
