<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shatter and Reassemble</title>
<meta name="description" content="Click an image and it fractures into triangular shards (random Delaunay-style mesh via clip-path polygons) that fly outward from the impact point with spin, then fall back together.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .glass-pane { position: relative; width: min(640px, 90vw); aspect-ratio: 4/3; cursor: crosshair; perspective: 900px; }
  .shard { position: absolute; inset: 0; background-size: cover; background-position: center; will-change: transform; transform-style: preserve-3d; }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <div class="glass-pane" role="button" tabindex="0" aria-label="Image. Click to shatter."></div>
  <p class="hint">Click anywhere on the image. Each shard is the same image, clipped to a triangle.</p>
</div></main>

<script src="../../assets/demo.js"></script>
<script>
  const pane = document.querySelector(".glass-pane");
  const url = `url(${Demo.artURL(960, 720, 3)})`;
  let shards = [], busy = false;
  // Triangulate a jittered grid: each cell splits into two triangles along a random diagonal.
  function build() {
    pane.replaceChildren(); shards = [];
    const C = 7, R = 5, pts = [];
    for (let y = 0; y <= R; y++) for (let x = 0; x <= C; x++) {
      const edgeX = x === 0 || x === C, edgeY = y === 0 || y === R;
      pts.push([(x / C) * 100 + (edgeX ? 0 : (Math.random() - .5) * 9), (y / R) * 100 + (edgeY ? 0 : (Math.random() - .5) * 11)]);
    }
    const P = (x, y) => pts[y * (C + 1) + x];
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
      const a = P(x, y), b = P(x + 1, y), c = P(x + 1, y + 1), d = P(x, y + 1);
      const tris = Math.random() < .5 ? [[a, b, c], [a, c, d]] : [[a, b, d], [b, c, d]];
      for (const t of tris) {
        const el = document.createElement("div"); el.className = "shard"; el.style.backgroundImage = url;
        el.style.clipPath = `polygon(${t.map((p) => p[0] + "% " + p[1] + "%").join(",")})`;
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        el.style.transformOrigin = `${cx}% ${cy}%`;
        pane.appendChild(el); shards.push({ el, cx, cy });
      }
    }
  }
  function shatter(px, py) {
    if (busy) return; busy = true;
    for (const s of shards) {
      const dx = s.cx - px, dy = s.cy - py, d = Math.hypot(dx, dy) + 1, force = 160 / Math.sqrt(d);
      const tx = (dx / d) * force * (4 + Math.random() * 3), ty = (dy / d) * force * (4 + Math.random() * 3) + 60;
      const rz = (Math.random() - .5) * 400, rx = (Math.random() - .5) * 300, tz = Math.random() * 300;
      const delay = d * 4;    // shards near the impact go first
      s.el.animate([
        { transform: "none", opacity: 1 },
        { transform: `translate3d(${tx}px, ${ty}px, ${tz}px) rotateX(${rx}deg) rotateZ(${rz}deg)`, opacity: 0.9, offset: 0.45 },
        { transform: `translate3d(${tx}px, ${ty}px, ${tz}px) rotateX(${rx}deg) rotateZ(${rz}deg)`, opacity: 0.9, offset: 0.55 },
        { transform: "none", opacity: 1 },
      ], { duration: Demo.reduced ? 1 : 2600, delay, easing: "cubic-bezier(.2,.7,.3,1)" });
    }
    setTimeout(() => { busy = false; build(); }, 3200);
  }
  pane.addEventListener("click", (e) => { const r = pane.getBoundingClientRect(); shatter(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100); });
  pane.addEventListener("keydown", (e) => e.key === "Enter" && shatter(50, 50));
  build();
</script>
</body>
</html>
