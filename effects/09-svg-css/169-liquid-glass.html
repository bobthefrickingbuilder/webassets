<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass Refraction</title>
<meta name="description" content="Apple-style Liquid Glass: draggable panels bend the content behind them at their rounded edges using a generated SVG displacement map in backdrop-filter, with specular rims. Frosted fallback outside Chromium.">
<meta name="tech" content="SVG, CSS, JS">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { overflow: hidden; }
  .backdrop { position: fixed; inset: 0; background-size: cover; background-position: center; }
  .backdrop .words { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 900 clamp(60px, 13vw, 200px)/.9 var(--font); letter-spacing: -.05em; color: #fff; mix-blend-mode: overlay; }
  .backdrop .stripes { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgb(255 255 255 / .12) 0 2px, transparent 2px 40px); }
  .glass { position: absolute; touch-action: none; cursor: grab; user-select: none; display: grid; place-items: center; color: #fff; font-weight: 600; text-shadow: 0 1px 8px rgb(0 0 0 / .35);
           box-shadow: inset 0 1.5px 0 rgb(255 255 255 / .75), inset 0 -1px 1px rgb(255 255 255 / .25), inset 0 0 0 1px rgb(255 255 255 / .18), 0 12px 40px rgb(0 0 0 / .25); }
  .glass:active { cursor: grabbing; }
  .glass.fallback { backdrop-filter: blur(14px) saturate(1.6); -webkit-backdrop-filter: blur(14px) saturate(1.6); background: rgb(255 255 255 / .08); }
  .note { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgb(0 0 0 / .55); font-size: 13px; }
</style>
</head>
<body>
<div class="backdrop"><div class="stripes"></div><div class="words">LIQUID<br>GLASS</div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs class="filters"></defs></svg>
<p class="note"></p>

<script src="../../assets/demo.js"></script>
<script>
  document.querySelector(".backdrop").style.backgroundImage = `url(${Demo.artURL(1600, 1000, 4)})`;
  // backdrop-filter: url(#svg) only renders in Chromium today.
  const supportsSvgBackdrop = !!navigator.userAgentData;
  document.querySelector(".note").textContent = supportsSvgBackdrop ? "Drag the glass panels around" : "Your browser shows the frosted fallback (refraction needs Chromium)";
  const defs = document.querySelector(".filters");

  /* Displacement map for a rounded rectangle: inside a bezel band near the edge, pixels are pushed along
     the surface normal, strongest at the rim (like the curved edge of a thick lens). R = x, G = y, 128 = none. */
  function makeMap(w, h, r, bezel) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"), img = g.createImageData(w, h), d = img.data;
    const sdf = (x, y) => {
      const qx = Math.abs(x - w / 2) - (w / 2 - r), qy = Math.abs(y - h / 2) - (h / 2 - r);
      return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dist = -sdf(x + .5, y + .5);                        // depth inside the shape
      let dx = 0, dy = 0;
      if (dist > 0 && dist < bezel) {
        const nx = sdf(x + 1.5, y + .5) - sdf(x - .5, y + .5), ny = sdf(x + .5, y + 1.5) - sdf(x + .5, y - .5);
        const len = Math.hypot(nx, ny) || 1, k = Math.pow(1 - dist / bezel, 2);
        dx = (nx / len) * k; dy = (ny / len) * k;
      }
      const i = (y * w + x) * 4;
      d[i] = 128 + dx * 127; d[i + 1] = 128 + dy * 127; d[i + 2] = 128; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  function panel(id, w, h, r, x, y, label) {
    const el = document.createElement("div"); el.className = "glass"; el.textContent = label;
    Object.assign(el.style, { width: w + "px", height: h + "px", borderRadius: r + "px", left: x + "px", top: y + "px" });
    if (supportsSvgBackdrop) {
      defs.insertAdjacentHTML("beforeend", `<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feImage href="${makeMap(w, h, r, Math.min(w, h) * 0.28)}" x="0" y="0" width="${w}" height="${h}" result="map"/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="${Math.min(w, h) * 0.45}" xChannelSelector="R" yChannelSelector="G"/>
      </filter>`);
      el.style.backdropFilter = `url(#${id}) saturate(1.5) brightness(1.08)`;
    } else el.classList.add("fallback");
    document.body.appendChild(el);
    // Drag
    let ox, oy;
    el.addEventListener("pointerdown", (e) => { ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop; el.setPointerCapture(e.pointerId); });
    el.addEventListener("pointermove", (e) => { if (ox == null) return; el.style.left = e.clientX - ox + "px"; el.style.top = e.clientY - oy + "px"; });
    el.addEventListener("pointerup", () => (ox = oy = null));
  }
  panel("lg1", 300, 180, 40, innerWidth * 0.18, innerHeight * 0.22, "Drag me");
  panel("lg2", 150, 150, 75, innerWidth * 0.62, innerHeight * 0.5, "Lens");
  panel("lg3", 240, 64, 32, innerWidth * 0.4, innerHeight * 0.72, "Liquid pill");
</script>
</body>
</html>
