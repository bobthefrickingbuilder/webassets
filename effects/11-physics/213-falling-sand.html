<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falling Sand Sandbox</title>
<meta name="description" content="A falling-sand cellular automaton: paint sand, water, stone, wood, fire and acid. Sand piles, water flows and levels, fire burns wood into smoke, acid eats almost anything. Pixel buffer written straight into ImageData.">
<meta name="tech" content="Canvas, Cellular automata">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { overflow: hidden; background: #0c0c10; }
  canvas.full-canvas { image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  .tools { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 8px; border-radius: 16px; background: rgb(20 20 28 / .85); }
  .tools button { padding: 7px 12px; border-radius: 10px; border: 2px solid transparent; background: #22232e; cursor: pointer; font-size: 13px; }
  .tools button[aria-pressed="true"] { border-color: #fff; }
  .tools i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<canvas class="full-canvas" aria-label="Falling sand sandbox. Paint with the selected material."></canvas>
<div class="tools" role="toolbar" aria-label="Materials"></div>

<script src="../../assets/demo.js"></script>
<script>
  // Materials: 0 empty, 1 sand, 2 water, 3 stone, 4 wood, 5 fire, 6 smoke, 7 acid, 8 steam
  const MAT = [
    { name: "Erase", col: [12, 12, 16] }, { name: "Sand", col: [230, 196, 120] }, { name: "Water", col: [60, 130, 240] },
    { name: "Stone", col: [120, 120, 130] }, { name: "Wood", col: [130, 82, 45] }, { name: "Fire", col: [255, 120, 30] },
    { name: "Smoke", col: [90, 90, 100] }, { name: "Acid", col: [120, 255, 80] },
  ];
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  const SCALE = 4;
  let w, h, grid, life, img, buf, moved;
  function resize() {
    w = Math.ceil(innerWidth / SCALE); h = Math.ceil(innerHeight / SCALE); cv.width = w; cv.height = h;
    grid = new Uint8Array(w * h); life = new Uint8Array(w * h); moved = new Uint8Array(w * h);
    img = ctx.createImageData(w, h); buf = new Uint32Array(img.data.buffer);
    // starter scene: a stone shelf, a wood beam and a sand dune
    for (let x = Math.floor(w * .15); x < w * .45; x++) set(x, Math.floor(h * .5), 3);
    for (let x = Math.floor(w * .55); x < w * .85; x++) for (let y = Math.floor(h * .62); y < h * .65; y++) set(x, y, 4);
    for (let x = 0; x < w; x++) { const top = h - 8 - Math.floor(Math.sin(x / w * Math.PI) * h * .12); for (let y = top; y < h; y++) set(x, y, 1); }
  }
  const idx = (x, y) => y * w + x;
  const get = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 3 : grid[idx(x, y)]);
  function set(x, y, m) { if (x < 0 || y < 0 || x >= w || y >= h) return; const i = idx(x, y); grid[i] = m; life[i] = m === 5 ? 20 + Math.random() * 40 : m === 6 ? 60 + Math.random() * 60 : 0; }
  function swap(a, b) { const t = grid[a]; grid[a] = grid[b]; grid[b] = t; const l = life[a]; life[a] = life[b]; life[b] = l; moved[b] = 1; }
  const dense = { 0: 0, 6: 0, 2: 1, 7: 1, 1: 2 };   // what can sink through what
  function update() {
    moved.fill(0);
    const flip = Math.random() < .5;
    for (let y = h - 1; y >= 0; y--) for (let k = 0; k < w; k++) {
      const x = flip ? k : w - 1 - k, i = idx(x, y), m = grid[i];
      if (!m || moved[i]) continue;
      const dir = Math.random() < .5 ? -1 : 1;
      const canEnter = (tx, ty, heavier) => { const t = get(tx, ty); return t === 0 || (heavier && (t === 2 || t === 7 || t === 6) && (dense[m] || 0) > (dense[t] || 0)); };
      if (m === 1) {   // sand: down, else diagonal; sinks through liquids
        if (canEnter(x, y + 1, 1)) swap(i, idx(x, y + 1));
        else if (canEnter(x + dir, y + 1, 1)) swap(i, idx(x + dir, y + 1));
        else if (canEnter(x - dir, y + 1, 1)) swap(i, idx(x - dir, y + 1));
      } else if (m === 2 || m === 7) {   // liquids: down, diagonal, then spread sideways
        if (m === 7) {   // acid dissolves neighbours (not stone often)
          for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) { const t = get(x + dx, y + dy); if (t && t !== 7 && t !== 3 && Math.random() < .08) { set(x + dx, y + dy, 0); if (Math.random() < .3) { grid[i] = 0; break; } } else if (t === 3 && Math.random() < .004) set(x + dx, y + dy, 0); }
          if (!grid[i]) continue;
        }
        if (get(x, y + 1) === 0) swap(i, idx(x, y + 1));
        else if (get(x + dir, y + 1) === 0) swap(i, idx(x + dir, y + 1));
        else { for (let s = 1; s <= 3; s++) { if (get(x + dir * s, y) !== 0) { if (s > 1) swap(i, idx(x + dir * (s - 1), y)); break; } if (s === 3) swap(i, idx(x + dir * s, y)); } }
      } else if (m === 5) {   // fire: rises flickering, ignites wood, boils water, dies into smoke
        if (--life[i] <= 0) { grid[i] = Math.random() < .5 ? 6 : 0; life[i] = 80; continue; }
        for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1], [1, -1], [-1, -1]]) {
          const t = get(x + dx, y + dy);
          if (t === 4 && Math.random() < .04) set(x + dx, y + dy, 5);
          if (t === 2 && Math.random() < .2) { set(x + dx, y + dy, 6); grid[i] = 0; break; }
        }
        if (!grid[i]) continue;
        const ty = y - 1, tx = x + (Math.random() * 3 | 0) - 1;
        if (Math.random() < .6 && get(tx, ty) === 0) swap(i, idx(tx, ty));
      } else if (m === 6) {   // smoke: drifts up and fades
        if (--life[i] <= 0) { grid[i] = 0; continue; }
        const tx = x + (Math.random() * 3 | 0) - 1;
        if (get(tx, y - 1) === 0) swap(i, idx(tx, y - 1)); else if (get(x + dir, y) === 0) swap(i, idx(x + dir, y));
      } else if (m === 4 && life[i] === 0) { /* wood is static */ }
    }
  }
  const pack = ([r, g, b]) => (255 << 24) | (b << 16) | (g << 8) | r;
  const shades = MAT.map((m) => [0, 1, 2, 3].map((k) => pack(m.col.map((c) => Math.max(0, Math.min(255, c + (k - 1.5) * 10))))));
  const noise = new Uint8Array(1 << 16).map(() => Math.random() * 4);
  function render() {
    for (let i = 0; i < grid.length; i++) {
      const m = grid[i];
      if (m === 5) { const f = life[i] / 60; buf[i] = pack([255, 80 + f * 170 | 0, 20 + f * 60 | 0]); }
      else if (m === 6) { const a = Math.min(1, life[i] / 100); buf[i] = pack([12 + 80 * a | 0, 12 + 80 * a | 0, 16 + 86 * a | 0]); }
      else buf[i] = m ? shades[m][noise[i & 65535]] : shades[0][1];
    }
    ctx.putImageData(img, 0, 0);
  }
  // UI
  let cur = 1, painting = false, px = -1, py = -1;
  const tools = document.querySelector(".tools");
  MAT.forEach((m, i) => { if (i === 6) return; const b = document.createElement("button"); b.innerHTML = `<i style="background:rgb(${m.col})"></i>${m.name}`; b.setAttribute("aria-pressed", i === cur); b.onclick = () => { cur = i; tools.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }; tools.appendChild(b); });
  const clearBtn = document.createElement("button"); clearBtn.textContent = "Clear"; clearBtn.onclick = () => grid.fill(0); tools.appendChild(clearBtn);
  addEventListener("keydown", (e) => { const n = +e.key; if (n >= 1 && n <= 7) tools.children[n - 1].click(); });
  function paintLine(x0, y0, x1, y1) {
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1), r = cur === 3 || cur === 4 ? 2 : 3;
    for (let s = 0; s <= steps; s++) {
      const cx = Math.round(x0 + (x1 - x0) * s / steps), cy = Math.round(y0 + (y1 - y0) * s / steps);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r && (cur === 0 || cur === 3 || cur === 4 || Math.random() < .5)) { if (cur === 0 || get(cx + dx, cy + dy) === 0) set(cx + dx, cy + dy, cur); }
    }
  }
  const toGrid = (e) => [Math.floor(e.clientX / SCALE), Math.floor(e.clientY / SCALE)];
  cv.addEventListener("pointerdown", (e) => { painting = true; [px, py] = toGrid(e); paintLine(px, py, px, py); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => { if (!painting) return; const [x, y] = toGrid(e); paintLine(px, py, x, y); px = x; py = y; });
  addEventListener("pointerup", () => (painting = false));
  addEventListener("resize", resize); resize();
  // a gentle demo: pour sand and water from the top until the user interacts
  let demo = !Demo.reduced, t = 0;
  cv.addEventListener("pointerdown", () => (demo = false), { once: true });
  function frame() {
    if (demo) { t++; const x = Math.floor(w * (.3 + .1 * Math.sin(t / 50))); for (let k = 0; k < 3; k++) if (!get(x + k, 2)) set(x + k, 2, t % 400 < 200 ? 1 : 2); const fx = Math.floor(w * .7); if (t % 300 === 150) for (let k = 0; k < 6; k++) set(fx + k, Math.floor(h * .62) - 1, 5); }
    if (painting) paintLine(px, py, px, py);
    update(); render(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
