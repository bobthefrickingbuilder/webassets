<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly Soft-body Blobs</title>
<meta name="description" content="Wobbly pressure soft bodies: each blob is a ring of Verlet points held by springs and an internal gas pressure, so it squashes, bounces and jiggles. Drag blobs around and fling them at each other; they have googly eyes.">
<meta name="tech" content="Canvas, Verlet physics">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { overflow: hidden; background: #fff6e9; }
  canvas { cursor: grab; touch-action: none; }
  .hint { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); color: #886; }
</style>
</head>
<body>
<canvas class="full-canvas" aria-label="Soft jelly blobs. Drag and throw them."></canvas>
<p class="hint">Grab a blob and fling it · double-click to add one</p>

<script src="../../assets/demo.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, dpr;
  function resize() { dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener("resize", resize); resize();
  const COLS = ["#ff6b8b", "#59c3ff", "#7ee081", "#ffc145", "#b48cff"];
  const N = 24, G = 1400;
  const blobs = [];
  function blob(cx, cy, r, col) {
    const pts = [];
    for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2; pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, px: cx + Math.cos(a) * r, py: cy + Math.sin(a) * r }); }
    const seg = 2 * r * Math.sin(Math.PI / N);
    blobs.push({ pts, r, seg, area: Math.PI * r * r, col, blink: Math.random() * 5 });
  }
  const area = (p) => { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i].x * q.y - q.x * p[i].y; } return a / 2; };
  function step(dt) {
    for (const b of blobs) for (const p of b.pts) {
      const vx = (p.x - p.px) * .995, vy = (p.y - p.py) * .995;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + G * dt * dt;
    }
    if (drag) { const p = drag.b.pts; for (let i = 0; i < N; i++) { const q = p[i], k = i === drag.i ? .5 : 0; q.x += (mx + drag.ox[i] - q.x) * (i === drag.i ? .5 : .02); q.y += (my + drag.oy[i] - q.y) * (i === drag.i ? .5 : .02); } }
    for (let it = 0; it < 6; it++) {
      for (const b of blobs) {
        const p = b.pts;
        // edge springs (distance constraints)
        for (let i = 0; i < N; i++) {
          const a = p[i], c = p[(i + 1) % N], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - b.seg) / d * .5;
          a.x += dx * f; a.y += dy * f; c.x -= dx * f; c.y -= dy * f;
        }
        // pressure: push every point along its outward normal in proportion to the missing area
        const err = (b.area - area(p)) / (b.r * 2 * Math.PI) * .9;
        for (let i = 0; i < N; i++) {
          const a = p[(i + N - 1) % N], c = p[(i + 1) % N], nx = c.y - a.y, ny = -(c.x - a.x), l = Math.hypot(nx, ny) || 1;
          p[i].x += nx / l * err; p[i].y += ny / l * err;
        }
        // walls with friction
        for (const q of p) {
          if (q.y > H - 2) { q.y = H - 2; q.px += (q.x - q.px) * .3; }
          if (q.x < 2) { q.x = 2; q.py += (q.y - q.py) * .3; } if (q.x > W - 2) { q.x = W - 2; q.py += (q.y - q.py) * .3; }
          if (q.y < -400) q.y = -400;
        }
      }
      // blob vs blob: push points out of other blobs' centroid circles (cheap but convincing)
      for (const a of blobs) for (const b of blobs) {
        if (a === b) continue;
        const c = centroid(b);
        for (const q of a.pts) {
          const dx = q.x - c.x, dy = q.y - c.y, d = Math.hypot(dx, dy), min = b.r * .92;
          if (d < min && d > 0) { const f = (min - d) / d * .5; q.x += dx * f; q.y += dy * f; for (const s of b.pts) { s.x -= dx * f / N * 2; s.y -= dy * f / N * 2; } }
        }
      }
    }
  }
  const centroid = (b) => { let x = 0, y = 0; for (const p of b.pts) { x += p.x; y += p.y; } return { x: x / N, y: y / N }; };
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const b of blobs) {
      const p = b.pts, c = centroid(b);
      ctx.beginPath();
      // smooth closed curve through the midpoints
      for (let i = 0; i <= N; i++) { const a = p[i % N], n = p[(i + 1) % N], mxp = (a.x + n.x) / 2, myp = (a.y + n.y) / 2; i ? ctx.quadraticCurveTo(a.x, a.y, mxp, myp) : ctx.moveTo(mxp, myp); }
      const g = ctx.createRadialGradient(c.x - b.r * .35, c.y - b.r * .4, b.r * .1, c.x, c.y, b.r * 1.3);
      g.addColorStop(0, "#fff"); g.addColorStop(.25, b.col); g.addColorStop(1, b.col);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgb(0 0 0 / .12)"; ctx.stroke();
      // googly eyes that look toward the pointer and blink
      const blink = ((t + b.blink) % 4) < .12;
      for (const s of [-1, 1]) {
        const ex = c.x + s * b.r * .3, ey = c.y - b.r * .15, er = b.r * .2;
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(ex, ey, er, blink ? er * .1 : er, 0, 0, 7); ctx.fill();
        if (!blink) { const a = Math.atan2(my - ey, mx - ex); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(ex + Math.cos(a) * er * .45, ey + Math.sin(a) * er * .45, er * .5, 0, 7); ctx.fill(); }
      }
      ctx.strokeStyle = "#222"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c.x, c.y + b.r * .15, b.r * .18, .2, Math.PI - .2); ctx.stroke();
    }
  }
  let mx = W / 2, my = H / 2, drag = null;
  cv.addEventListener("pointerdown", (e) => {
    mx = e.clientX; my = e.clientY;
    for (const b of blobs) {
      const c = centroid(b); if (Math.hypot(mx - c.x, my - c.y) > b.r) continue;
      let i = 0, best = 1e9; b.pts.forEach((p, j) => { const d = Math.hypot(p.x - mx, p.y - my); if (d < best) { best = d; i = j; } });
      drag = { b, i, ox: b.pts.map((p) => p.x - mx), oy: b.pts.map((p) => p.y - my) };
      cv.setPointerCapture(e.pointerId); break;
    }
  });
  addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; });
  addEventListener("pointerup", () => (drag = null));
  cv.addEventListener("dblclick", (e) => { blob(e.clientX, e.clientY, 40 + Math.random() * 40, COLS[blobs.length % 5]); if (blobs.length > 12) blobs.shift(); });
  const n = Math.max(3, Math.min(6, Math.round(W / 250)));
  for (let i = 0; i < n; i++) blob(W * (i + .5) / n, H * .3 - (i % 2) * 120, 55 + (i * 17) % 35, COLS[i % 5]);
  let last = performance.now(), t0 = last;
  function frame(now) {
    const dt = 1 / 60; last = now;
    if (!Demo.reduced || drag) { step(dt / 2); step(dt / 2); }
    draw((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  if (Demo.reduced) for (let i = 0; i < 400; i++) step(1 / 120);
  requestAnimationFrame(frame);
</script>
</body>
</html>
