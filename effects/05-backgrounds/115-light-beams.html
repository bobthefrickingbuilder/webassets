<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweeping Spotlight Beams</title>
<meta name="description" content="Stage lighting in CSS: soft conic-gradient spotlight beams sweep back and forth from above, crossing over a hazy floor with a glowing headline.">
<meta name="tech" content="CSS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 110%, #1e1b4b, #05050a 60%); }
  .beam { position: absolute; top: -10vh; width: 60vmax; height: 140vh; transform-origin: 50% 0; filter: blur(8px); mix-blend-mode: screen;
          background: conic-gradient(from 168deg at 50% 0%, transparent 0deg, var(--c) 12deg, transparent 24deg); opacity: .55; }
  .b1 { left: calc(15% - 30vmax); --c: rgb(167 139 250 / .7); animation: sweep 7s ease-in-out infinite alternate; }
  .b2 { left: calc(50% - 30vmax); --c: rgb(34 211 238 / .55); animation: sweep 9s ease-in-out infinite alternate-reverse; }
  .b3 { left: calc(85% - 30vmax); --c: rgb(244 114 182 / .6); animation: sweep 6s ease-in-out infinite alternate; animation-delay: -2s; }
  @keyframes sweep { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  .haze { position: absolute; left: 0; right: 0; bottom: 0; height: 40vh; background: linear-gradient(transparent, rgb(124 92 255 / .15)); }
  .hero { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .hero h1 { font-size: clamp(48px, 10vw, 150px); letter-spacing: -.05em; margin: 0; text-shadow: 0 0 60px rgb(167 139 250 / .5); }
  @media (prefers-reduced-motion: reduce) { .beam { animation: none; } }
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="haze"></div></div>
<section class="hero"><h1>Showtime</h1></section>
<script src="../../assets/demo.js"></script>
</body>
</html>
