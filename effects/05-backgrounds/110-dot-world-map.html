<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dot-matrix World Map</title>
<meta name="description" content="A world map made of dots, with pulsing city markers and animated great-circle-style arcs carrying packets between them, like a global-network hero section.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .map-wrap { position: relative; width: min(1200px, 96vw); aspect-ratio: 2 / 1; }
  canvas { width: 100%; height: 100%; }
  .stat { display: flex; gap: 48px; justify-content: center; color: var(--muted); }
  .stat b { display: block; font-size: 32px; color: var(--fg); letter-spacing: -.02em; }
</style>
</head>
<body>
<main class="center"><div class="stack">
  <div class="map-wrap"><canvas aria-label="World map with network connections between major cities"></canvas></div>
  <div class="stat"><div><b>12</b>Regions</div><div><b class="live">0</b>Requests / sec</div><div><b>38ms</b>Global p50</div></div>
</div></main>

<script src="../../assets/demo.js"></script>
<script src="../../assets/world.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  const GW = 180, GH = 76;                   // dot grid (lat 85° to -67° keeps the poles off-canvas)
  const LAT_TOP = 85, LAT_BOT = -67;
  const mask = WORLD.landMask(720, 360);
  let W, H, dpr, dotLayer;
  const lonLatToXY = (lon, lat) => [((lon + 180) / 360) * W, ((LAT_TOP - lat) / (LAT_TOP - LAT_BOT)) * H];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = cv.width = r.width * dpr; H = cv.height = r.height * dpr;
    // The land dots never change, so draw them once to an offscreen layer and blit it each frame.
    dotLayer = document.createElement("canvas"); dotLayer.width = W; dotLayer.height = H;
    const g = dotLayer.getContext("2d"), dr = Math.max(1, W / GW * 0.28);
    g.fillStyle = "#2a3040"; g.beginPath();
    for (let gy = 0; gy < GH; gy++) for (let gx = 0; gx < GW; gx++) {
      const lon = -180 + (gx + .5) * 360 / GW, lat = LAT_TOP - (gy + .5) * (LAT_TOP - LAT_BOT) / GH;
      if (!mask.isLand(((lon + 180) / 360) * 720, ((90 - lat) / 180) * 360)) continue;
      const [x, y] = lonLatToXY(lon, lat);
      g.moveTo(x + dr, y); g.arc(x, y, dr, 0, 6.283);
    }
    g.fill();
  }
  const cities = WORLD.CITIES.map((c) => ({ ...c, phase: Math.random() * 6.28 }));
  const arcs = [];
  function spawnArc() {
    const a = cities[(Math.random() * cities.length) | 0]; let b;
    do b = cities[(Math.random() * cities.length) | 0]; while (b === a);
    arcs.push({ a, b, t: 0, speed: 0.006 + Math.random() * 0.006, hue: 180 + Math.random() * 120 });
  }
  function arcPoint(arc, t) {
    const [x1, y1] = lonLatToXY(arc.a.lon, arc.a.lat), [x2, y2] = lonLatToXY(arc.b.lon, arc.b.lat);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - Math.hypot(x2 - x1, y2 - y1) * 0.35;   // lifted control point
    const u = 1 - t;
    return [u * u * x1 + 2 * u * t * mx + t * t * x2, u * u * y1 + 2 * u * t * my + t * t * y2];
  }
  let requests = 0;
  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(dotLayer, 0, 0);
    if (Math.random() < 0.05 && arcs.length < 14) spawnArc();
    for (let i = arcs.length - 1; i >= 0; i--) {
      const arc = arcs[i]; arc.t += arc.speed;
      if (arc.t > 1.4) { arcs.splice(i, 1); requests += 1; continue; }
      // Trail: the arc is drawn from max(0, t-0.4) to min(1, t).
      const t0 = Math.max(0, arc.t - 0.4), t1 = Math.min(1, arc.t);
      ctx.lineWidth = 1.5 * dpr; ctx.lineCap = "round";
      for (let s = 0; s < 20; s++) {
        const ta = t0 + (t1 - t0) * (s / 20), tb = t0 + (t1 - t0) * ((s + 1) / 20);
        const [ax, ay] = arcPoint(arc, ta), [bx, by] = arcPoint(arc, tb);
        ctx.strokeStyle = `hsla(${arc.hue}, 90%, 65%, ${(s / 20) * (arc.t > 1 ? 1.4 - arc.t : 1)})`;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
      if (arc.t <= 1) { const [px, py] = arcPoint(arc, arc.t); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px, py, 2.5 * dpr, 0, 6.283); ctx.fill(); }
    }
    for (const c of cities) {
      const [x, y] = lonLatToXY(c.lon, c.lat);
      const k = ((now / 1000 + c.phase) % 2) / 2;
      ctx.strokeStyle = `rgba(34,211,238,${1 - k})`; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath(); ctx.arc(x, y, (3 + k * 14) * dpr, 0, 6.283); ctx.stroke();
      ctx.fillStyle = "#22d3ee"; ctx.beginPath(); ctx.arc(x, y, 3 * dpr, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  setInterval(() => { document.querySelector(".live").textContent = (requests * 1234 + Math.floor(Math.random() * 999)).toLocaleString(); requests = 0; }, 1000);
  addEventListener("resize", resize); resize();
  requestAnimationFrame(frame);
</script>
</body>
</html>
