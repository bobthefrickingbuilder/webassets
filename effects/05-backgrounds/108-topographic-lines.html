<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Topographic Contours</title>
<meta name="description" content="A slowly shifting terrain drawn as anti-aliased contour lines, with heavier index contours every fifth line and a lifted 'hill' that follows the pointer.">
<meta name="tech" content="WebGL">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hero { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .hero h1 { font-size: clamp(40px, 8vw, 110px); letter-spacing: -.04em; margin: 0; padding: 0 .3em; background: #f2efe6; color: #1c1917; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<section class="hero"><h1>Elevation</h1></section>

<script src="../../assets/demo.js"></script>
<script src="../../assets/gl.js"></script>
<script>
  const FRAG = `
    uniform vec2 u_res; uniform float u_time; uniform vec4 u_mouse;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.02; a *= .5; } return v; }
    void main(){
      vec2 p = gl_FragCoord.xy / u_res.y * 2.2;
      float h = fbm(p + vec2(u_time * .02, u_time * .015));
      vec2 m = (gl_FragCoord.xy - u_mouse.xy) / u_res.y;
      h += .35 * exp(-dot(m, m) * 18.);                       // pointer raises a hill
      float levels = 28.;
      float v = h * levels;
      // Distance to the nearest integer level, divided by its screen-space rate of change = line width in px.
      float d = abs(fract(v - .5) - .5) / fwidth(v);
      bool major = mod(floor(v + .5), 5.) == 0.;
      float line = 1. - smoothstep(0., major ? 1.6 : .9, d);
      vec3 paper = vec3(.95, .937, .9);
      vec3 ink = mix(vec3(.55, .45, .35), vec3(.25, .2, .15), major ? 1. : 0.);
      o = vec4(mix(paper, ink, line * (major ? 1. : .7)), 1.);
    }`;
  GL.fullscreen(document.querySelector("canvas"), FRAG, { dpr: 2 });
</script>
</body>
</html>
