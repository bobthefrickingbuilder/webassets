<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro CRT Screen</title>
<meta name="description" content="A CSS cathode-ray tube: scanlines, RGB phosphor mask, rolling refresh bar, flicker, vignette, curved bezel and glowing green text from a typing terminal.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: #111; }
  .tv { width: min(900px, 94vw); aspect-ratio: 4 / 3; padding: 4%; border-radius: 4% / 5%; background: linear-gradient(145deg, #2b2b2b, #0e0e0e); box-shadow: inset 0 0 0 2px #3a3a3a, 0 30px 80px #000; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 6% / 8%; overflow: hidden; background: radial-gradient(ellipse at center, #062b12 0%, #021007 75%); animation: flicker .12s infinite; }
  .screen pre { margin: 0; padding: 6% 7%; font: clamp(11px, 1.7vw, 18px)/1.45 var(--mono); color: #6dff8f; text-shadow: 0 0 2px #6dff8f, 0 0 10px rgb(109 255 143 / .6), 2px 0 1px rgb(255 0 80 / .25), -2px 0 1px rgb(0 120 255 / .25); white-space: pre-wrap; }
  /* Scanlines + phosphor triads */
  .screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(rgb(0 0 0 / .32) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgb(255 0 0 / .05) 0 1px, rgb(0 255 0 / .05) 1px 2px, rgb(0 0 255 / .05) 2px 3px); }
  /* Vignette + glass reflection */
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 55%, rgb(0 0 0 / .75) 100%), linear-gradient(160deg, rgb(255 255 255 / .07), transparent 40%); }
  .roll { position: absolute; left: 0; right: 0; height: 18%; z-index: 2; pointer-events: none; background: linear-gradient(transparent, rgb(109 255 143 / .06), transparent); animation: roll 6s linear infinite; }
  @keyframes roll { from { top: -20%; } to { top: 110%; } }
  @keyframes flicker { 0% { opacity: .97; } 50% { opacity: 1; } 100% { opacity: .98; } }
  .cur { display: inline-block; width: .6em; height: 1.1em; background: #6dff8f; vertical-align: -.15em; animation: blink 1s steps(1) infinite; box-shadow: 0 0 8px #6dff8f; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .screen, .roll, .cur { animation: none; } }
</style>
</head>
<body>
<main class="center">
  <div class="tv"><div class="screen"><div class="roll"></div><pre><span class="out"></span><span class="cur"></span></pre></div></div>
</main>

<script src="../../assets/demo.js"></script>
<script>
  const lines = [
    "WEBASSETS BIOS v2.6 (C) 1986", "MEMORY TEST: 640K OK", "", "LOADING EFFECTS....... 250 FOUND",
    "", "> RUN CRT.EXE", "SCANLINES ......... ON", "PHOSPHOR GLOW ..... ON", "BARREL BEZEL ...... ON", "", "READY.", "> ",
  ];
  const out = document.querySelector(".out");
  const text = lines.join("\n");
  if (Demo.reduced) out.textContent = text;
  else { let i = 0; (function type() { out.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(type, text[i - 1] === "\n" ? 220 : 28); })(); }
</script>
</body>
</html>
