<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Particle Systems</title>
<meta name="description" content="Switchable ambient weather for any page: drifting snow with depth, slanted rain with splashes, tumbling autumn leaves, and falling confetti. Wind follows the pointer.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { transition: background 1s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .modes { position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 2; }
  .modes button { padding: 8px 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / .2); background: rgb(0 0 0 / .4); cursor: pointer; }
  .modes button[aria-pressed="true"] { background: #fff; color: #111; }
  .hero { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .hero h1 { font-size: clamp(44px, 9vw, 120px); letter-spacing: -.05em; margin: 0; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<div class="modes" role="group" aria-label="Weather"></div>
<section class="hero"><div><h1 class="title">Snow</h1><p class="hint">Move the pointer left/right to change the wind.</p></div></section>

<script src="../../assets/demo.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, mode = "snow", wind = 0, targetWind = 0;
  const P = [], splashes = [];
  const MODES = {
    snow:     { n: 260, bg: "linear-gradient(#0f172a, #334155)" },
    rain:     { n: 420, bg: "linear-gradient(#0b1120, #1e293b)" },
    leaves:   { n: 60,  bg: "linear-gradient(#451a03, #78350f)" },
    confetti: { n: 180, bg: "linear-gradient(#1e1b4b, #4c1d95)" },
  };
  const LEAF = ["#f97316", "#facc15", "#dc2626", "#a16207"], CONF = ["#f472b6", "#a78bfa", "#22d3ee", "#facc15", "#4ade80"];
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  function make(initial) {
    const z = Math.random();  // depth: 0 far, 1 near
    const p = { x: Math.random() * W, y: initial ? Math.random() * H : -20, z, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .1, sway: Math.random() * 6.28 };
    if (mode === "snow") { p.r = 1 + z * 3; p.vy = .4 + z * 1.4; }
    if (mode === "rain") { p.len = 10 + z * 20; p.vy = 10 + z * 10; }
    if (mode === "leaves") { p.r = 8 + z * 10; p.vy = .6 + z * 1.2; p.c = LEAF[(Math.random() * LEAF.length) | 0]; }
    if (mode === "confetti") { p.r = 4 + z * 5; p.vy = 1 + z * 2; p.c = CONF[(Math.random() * CONF.length) | 0]; }
    return p;
  }
  function setMode(m) {
    mode = m; P.length = 0;
    for (let i = 0; i < MODES[m].n; i++) P.push(make(true));
    document.body.style.background = MODES[m].bg;
    document.querySelector(".title").textContent = m[0].toUpperCase() + m.slice(1);
    document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === m));
  }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    wind += (targetWind - wind) * 0.02;
    for (const p of P) {
      p.sway += 0.02;
      p.y += p.vy; p.rot += p.vr;
      p.x += wind * (0.5 + p.z) + (mode === "rain" ? 0 : Math.sin(p.sway) * (mode === "leaves" ? 1.2 : 0.4));
      if (mode === "snow") { ctx.fillStyle = `rgba(255,255,255,${0.4 + p.z * 0.6})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
      else if (mode === "rain") {
        ctx.strokeStyle = `rgba(174,194,224,${0.25 + p.z * 0.5})`; ctx.lineWidth = 0.5 + p.z;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - wind * 1.5, p.y - p.len); ctx.stroke();
        if (p.y > H - 2 && p.z > .5) splashes.push({ x: p.x, y: H - 2, r: 0, a: .6 });
      } else {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.sway * 2));   // tumble
        ctx.fillStyle = p.c;
        if (mode === "leaves") { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.5, 0, 0, 6.283); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.moveTo(-p.r, 0); ctx.lineTo(p.r, 0); ctx.stroke(); }
        else ctx.fillRect(-p.r / 2, -p.r, p.r, p.r * 2);
        ctx.restore();
      }
      if (p.y > H + 20 || p.x < -60 || p.x > W + 60) Object.assign(p, make(false), p.x < -60 ? { x: W + 20 } : p.x > W + 60 ? { x: -20 } : {});
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i]; s.r += 0.8; s.a -= 0.04;
      if (s.a <= 0) { splashes.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(174,194,224,${s.a})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.3, 0, Math.PI, 0); ctx.stroke();
    }
    if (!Demo.reduced) requestAnimationFrame(frame);
  }
  const host = document.querySelector(".modes");
  Object.keys(MODES).forEach((m) => { const b = document.createElement("button"); b.textContent = m; b.dataset.m = m; b.onclick = () => setMode(m); host.appendChild(b); });
  addEventListener("pointermove", (e) => (targetWind = (e.clientX / innerWidth - 0.5) * 4));
  addEventListener("resize", resize); resize(); setMode("snow");
  requestAnimationFrame(frame);
</script>
</body>
</html>
