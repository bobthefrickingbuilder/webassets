<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightning Strikes</title>
<meta name="description" content="Procedural lightning: recursive midpoint displacement builds forked bolts that strike where you click, flashing the sky and fading with a glowing afterimage.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: #05060c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .hint { position: fixed; bottom: 20px; left: 0; right: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas aria-label="Storm. Click to strike lightning."></canvas>
<p class="hint">Click to strike · storms strike on their own too</p>

<script src="../../assets/demo.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, flash = 0;
  const bolts = [];
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", resize); resize();

  // Midpoint displacement: split each segment, push the midpoint sideways, recurse. Occasionally fork.
  function build(x1, y1, x2, y2, disp, depth, out, width) {
    if (disp < 2 || depth > 9) { out.push({ x1, y1, x2, y2, width }); return; }
    const mx = (x1 + x2) / 2 + (Math.random() - .5) * disp, my = (y1 + y2) / 2 + (Math.random() - .5) * disp * .3;
    build(x1, y1, mx, my, disp / 2, depth + 1, out, width);
    build(mx, my, x2, y2, disp / 2, depth + 1, out, width);
    if (Math.random() < 0.18 && width > 0.6) {
      const ang = Math.atan2(y2 - y1, x2 - x1) + (Math.random() - .5) * 1.4, len = Math.hypot(x2 - x1, y2 - y1) * (0.6 + Math.random());
      build(mx, my, mx + Math.cos(ang) * len, my + Math.sin(ang) * len, disp / 2, depth + 1, out, width * 0.55);
    }
  }
  function strike(x, y) {
    const segs = [];
    build(x + (Math.random() - .5) * 200, -10, x, y, Math.max(120, y * 0.4), 0, segs, 3);
    bolts.push({ segs, life: 1 });
    flash = 1;
  }
  cv.addEventListener("click", (e) => strike(e.clientX, e.clientY));
  (function auto() { setTimeout(() => { strike(Math.random() * W, H * (0.6 + Math.random() * 0.4)); auto(); }, 1500 + Math.random() * 3500); })();

  function frame() {
    ctx.fillStyle = `rgba(5,6,12,0.35)`; ctx.fillRect(0, 0, W, H);
    if (flash > 0) { ctx.fillStyle = `rgba(160,170,255,${flash * 0.25})`; ctx.fillRect(0, 0, W, H); flash *= 0.8; }
    ctx.lineCap = "round";
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      // Flicker: real strikes pulse a couple of times.
      const a = b.life * (0.6 + 0.4 * Math.random());
      for (const pass of [[14, `rgba(120,140,255,${a * 0.15})`], [5, `rgba(170,190,255,${a * 0.5})`], [1.5, `rgba(255,255,255,${a})`]]) {
        ctx.strokeStyle = pass[1];
        ctx.beginPath();
        for (const s of b.segs) { ctx.lineWidth = pass[0] * s.width / 3; ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
        ctx.stroke();
      }
      b.life -= 0.05;
      if (b.life <= 0) bolts.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
