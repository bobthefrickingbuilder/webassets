<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Mesh Gradient</title>
<meta name="description" content="A Stripe-style living gradient: domain-warped fractal noise blends four palette colours on the GPU, with film grain and switchable palettes.">
<meta name="tech" content="WebGL">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hero { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; }
  .hero h1 { font-size: clamp(44px, 9vw, 130px); letter-spacing: -.05em; line-height: .95; margin: 0; color: #fff; text-shadow: 0 4px 40px rgb(0 0 0 / .2); }
  .palettes { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .palettes button { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .6); cursor: pointer; }
  .palettes button[aria-pressed="true"] { border-color: #fff; transform: scale(1.15); }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<section class="hero"><h1>Fluid colour,<br>zero images.</h1></section>
<div class="palettes" role="group" aria-label="Palette"></div>

<script src="../../assets/demo.js"></script>
<script src="../../assets/gl.js"></script>
<script>
  const FRAG = `
    uniform vec2 u_res; uniform float u_time; uniform vec3 u_c1; uniform vec3 u_c2; uniform vec3 u_c3; uniform vec3 u_c4;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 5; i++){ v += a * noise(p); p = p * 2.03 + 1.7; a *= .5; } return v; }
    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      vec2 p = uv * vec2(u_res.x / u_res.y, 1.);
      float t = u_time * .06;
      // Domain warping: feed noise into the coordinates of more noise for organic folds.
      vec2 q = vec2(fbm(p * 1.3 + t), fbm(p * 1.3 - t + 3.1));
      vec2 r = vec2(fbm(p + q * 1.6 + vec2(1.7, 9.2) + t * 1.4), fbm(p + q * 1.6 + vec2(8.3, 2.8) - t));
      float n = fbm(p + r * 1.4);
      vec3 c = mix(u_c1, u_c2, smoothstep(.15, .75, n));
      c = mix(c, u_c3, smoothstep(.3, .9, length(q)));
      c = mix(c, u_c4, smoothstep(.55, .95, r.x) * .9);
      c += (hash(gl_FragCoord.xy + fract(u_time) * 100.) - .5) * .045;   // film grain
      o = vec4(c, 1.);
    }`;
  const palettes = [
    ["#ff6a3d", "#7c3aed", "#00d4ff", "#ffd166"],
    ["#0f172a", "#1d4ed8", "#06b6d4", "#e0f2fe"],
    ["#fda4af", "#f0abfc", "#fde68a", "#a5f3fc"],
    ["#052e16", "#16a34a", "#bef264", "#0ea5e9"],
  ];
  const toRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  let cur = palettes[0].map(toRGB), target = cur;
  const state = GL.fullscreen(document.querySelector("canvas"), FRAG, { dpr: 1 });
  if (state) state.uniforms = () => {
    cur = cur.map((c, i) => c.map((v, k) => v + (target[i][k] - v) * 0.04));   // smooth palette transitions
    return { u_c1: cur[0], u_c2: cur[1], u_c3: cur[2], u_c4: cur[3] };
  };
  const host = document.querySelector(".palettes");
  palettes.forEach((p, i) => {
    const b = document.createElement("button");
    b.style.background = `linear-gradient(135deg, ${p.join(",")})`;
    b.setAttribute("aria-label", "Palette " + (i + 1)); b.setAttribute("aria-pressed", i === 0);
    b.onclick = () => { target = p.map(toRGB); host.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); };
    host.appendChild(b);
  });
</script>
</body>
</html>
