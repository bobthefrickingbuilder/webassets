<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layered SVG Waves</title>
<meta name="description" content="Parallax ocean waves at the bottom of a hero: four translucent SVG wave layers loop horizontally at different speeds. Pure CSS animation.">
<meta name="tech" content="SVG, CSS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .sea { position: relative; min-height: 100vh; background: linear-gradient(160deg, #0ea5e9, #6366f1); display: grid; place-items: center; overflow: hidden; }
  .sea h1 { font-size: clamp(44px, 9vw, 120px); margin: 0 0 15vh; letter-spacing: -.05em; color: #fff; }
  .waves { position: absolute; left: 0; bottom: 0; width: 100%; height: 22vh; min-height: 120px; }
  /* Each layer is the same tile used twice (x=48 and x=-48 offsets) so a translate of 1 tile loops seamlessly. */
  .waves use { animation: wave 25s cubic-bezier(.55,.5,.45,.5) infinite; }
  .waves use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
  .waves use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
  .waves use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
  .waves use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
  @keyframes wave { 0% { transform: translate3d(-90px, 0, 0); } 100% { transform: translate3d(85px, 0, 0); } }
  .below { height: 60vh; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .waves use { animation: none; } }
</style>
</head>
<body>
<section class="sea">
  <h1>Ride the wave</h1>
  <svg class="waves" viewBox="0 24 150 28" preserveAspectRatio="none" aria-hidden="true">
    <defs><path id="w" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/></defs>
    <g><use href="#w" x="48" y="0" fill="rgb(255 255 255 / .7)"/><use href="#w" x="48" y="3" fill="rgb(255 255 255 / .5)"/><use href="#w" x="48" y="5" fill="rgb(255 255 255 / .3)"/><use href="#w" x="48" y="7" fill="#fff"/></g>
  </svg>
</section>
<div class="below"></div>
<script src="../../assets/demo.js"></script>
</body>
</html>
