<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireflies</title>
<meta name="description" content="A summer-night meadow: fireflies wander on smooth random paths and blink with their own rhythm, gathering around the pointer when it rests.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: linear-gradient(#020617, #0b1a12 70%, #050c08); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .grass { position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; background: #030805;
           clip-path: polygon(0 100%, 0 40%, 3% 10%, 5% 45%, 9% 0, 12% 50%, 16% 20%, 19% 55%, 24% 5%, 27% 50%, 31% 25%, 35% 60%, 40% 10%, 43% 55%, 48% 20%, 52% 60%, 57% 0, 60% 45%, 65% 15%, 69% 55%, 74% 8%, 78% 50%, 83% 22%, 87% 55%, 92% 5%, 95% 45%, 100% 20%, 100% 100%); }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<div class="grass" aria-hidden="true"></div>

<script src="../../assets/demo.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, m = null, still = 0;
  const flies = [];
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", resize); resize();
  for (let i = 0; i < 80; i++) flies.push({ x: Math.random() * W, y: H * (0.3 + Math.random() * 0.7), a: Math.random() * 6.28, s: 0.3 + Math.random() * 0.6, ph: Math.random() * 6.28, rate: 0.5 + Math.random() * 1.5 });
  addEventListener("pointermove", (e) => { m = { x: e.clientX, y: e.clientY }; still = 0; });
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    still++;
    for (const f of flies) {
      f.a += (Math.random() - 0.5) * 0.3;                    // wander: random walk on heading
      if (m && still > 40) {                                  // pointer resting: drift toward it
        const d = Math.atan2(m.y - f.y, m.x - f.x); f.a += Math.sin(d - f.a) * 0.05;
      }
      f.x += Math.cos(f.a) * f.s; f.y += Math.sin(f.a) * f.s;
      if (f.x < 0) f.x = W; if (f.x > W) f.x = 0; if (f.y < H * 0.15) f.a = Math.PI / 2; if (f.y > H) f.a = -Math.PI / 2;
      const glow = Math.max(0, Math.sin(t / 1000 * f.rate + f.ph)) ** 3;
      if (glow < 0.02) continue;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 14);
      g.addColorStop(0, `rgba(230,255,140,${glow})`); g.addColorStop(0.3, `rgba(190,255,90,${glow * 0.5})`); g.addColorStop(1, "rgba(190,255,90,0)");
      ctx.fillStyle = g; ctx.fillRect(f.x - 14, f.y - 14, 28, 28);
    }
    if (!Demo.reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
