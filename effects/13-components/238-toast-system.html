<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toast Notification System</title>
<meta name="description" content="A Sonner-style toast stack: new toasts slide in and older ones tuck behind in a 3D stack that fans out on hover, with auto-dismiss timers that pause on hover, progress bars, success/error/promise variants, action buttons and swipe-to-dismiss with velocity.">
<meta name="tech" content="JS, CSS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  main { min-height: 100vh; display: grid; place-content: center; gap: 10px; justify-items: center; padding: 80px 20px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btns button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; font-weight: 600; }
  .stack { position: fixed; right: 20px; bottom: 20px; width: min(360px, calc(100vw - 40px)); height: 0; z-index: 50; }
  .toast { position: absolute; right: 0; bottom: 0; width: 100%; padding: 14px 16px; border-radius: 14px; background: #1c1d26; border: 1px solid var(--line); box-shadow: 0 10px 30px rgb(0 0 0 / .4);
           display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; touch-action: pan-y; user-select: none; overflow: hidden;
           transition: transform .45s cubic-bezier(.2, 1, .3, 1), opacity .35s, height .3s; will-change: transform; }
  .toast .i { font-size: 18px; grid-row: span 2; }
  .toast b { font-size: 14px; } .toast small { color: var(--muted); grid-column: 2; }
  .toast .act { grid-row: span 2; padding: 6px 10px; border-radius: 8px; border: 0; background: #fff; color: #000; font-weight: 700; cursor: pointer; font-size: 12px; }
  .toast .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--c, var(--accent)); width: 100%; transform-origin: left; }
  .toast.success { --c: #22c55e; } .toast.error { --c: #ef4444; } .toast.loading .i { animation: spin 1s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .toast { transition: opacity .2s; } }
</style>
</head>
<body>
<main>
  <h1 style="margin:0">Toasts</h1>
  <p style="color:var(--muted);margin:0 0 8px">Hover the stack to expand it · swipe a toast right to dismiss</p>
  <div class="btns"><button data-t="default">Default</button><button data-t="success">Success</button><button data-t="error">Error</button><button data-t="action">With action</button><button data-t="promise">Promise</button></div>
</main>
<section class="stack" aria-live="polite" aria-label="Notifications"></section>

<script src="../../assets/demo.js"></script>
<script>
  const stack = document.querySelector(".stack");
  let toasts = [], hovering = false;
  const MAX_VISIBLE = 3, GAP = 10;
  function layout() {
    // newest at the bottom; collapsed: older toasts peek out behind, scaled down; expanded: real offsets
    let y = 0;
    toasts.forEach((t, idx) => {
      const i = toasts.length - 1 - idx;   // 0 = newest
      const h = t.el.offsetHeight;
      let tr, op = 1;
      if (hovering) { tr = `translateY(${-y}px)`; y += h + GAP; }
      else { tr = `translateY(${-i * 12}px) scale(${1 - i * .05})`; op = i < MAX_VISIBLE ? 1 - i * .15 : 0; }
      if (t.dragX) tr = `translateX(${t.dragX}px) ` + tr;
      if (t.entering) { tr = "translateY(120%)"; op = 0; }
      if (t.leaving) { tr = `translateX(${t.leaveX || 0}px) translateY(${hovering ? -y : 0}px) scale(.9)`; op = 0; }
      t.el.style.transform = tr; t.el.style.opacity = op; t.el.style.zIndex = 100 - i;
      t.el.style.pointerEvents = i < MAX_VISIBLE || hovering ? "auto" : "none";
    });
  }
  function toast({ type = "default", title, desc = "", action, duration = 4000 }) {
    const el = document.createElement("div"); el.className = "toast " + type; el.setAttribute("role", type === "error" ? "alert" : "status");
    const icon = { default: "💬", success: "✅", error: "⛔", loading: "⏳" }[type];
    el.innerHTML = `<span class="i">${icon}</span><b></b>${action ? '<button class="act"></button>' : "<span></span>"}<small></small><i class="bar"></i>`;
    el.querySelector("b").textContent = title; el.querySelector("small").textContent = desc;
    if (action) { el.querySelector(".act").textContent = action.label; el.querySelector(".act").onclick = () => { action.onClick(); dismiss(t); }; }
    stack.appendChild(el);
    const t = { el, remaining: duration, entering: true, dragX: 0 };
    toasts.push(t); layout(); requestAnimationFrame(() => requestAnimationFrame(() => { t.entering = false; layout(); }));
    swipe(t);
    if (toasts.length > 8) dismiss(toasts[0]);
    return {
      update(o) { el.className = "toast " + o.type; el.querySelector(".i").textContent = { success: "✅", error: "⛔" }[o.type]; el.querySelector("b").textContent = o.title; el.querySelector("small").textContent = o.desc || ""; t.remaining = 3000; t.total = 3000; },
    };
  }
  function dismiss(t, x = 0) { if (t.leaving) return; t.leaving = true; t.leaveX = x; layout(); setTimeout(() => { t.el.remove(); toasts = toasts.filter((o) => o !== t); layout(); }, 350); }
  // Timers tick only while the stack isn't hovered and the tab is visible.
  let last = performance.now();
  (function tick(now) {
    const dt = now - last; last = now;
    for (const t of [...toasts]) {
      if (t.leaving || t.el.classList.contains("loading")) continue;
      t.total ??= t.remaining;
      if (!hovering && !document.hidden && !t.dragging) t.remaining -= dt;
      t.el.querySelector(".bar").style.transform = `scaleX(${Math.max(0, t.remaining / t.total)})`;
      if (t.remaining <= 0) dismiss(t);
    }
    requestAnimationFrame(tick);
  })(last);
  stack.addEventListener("pointerenter", () => { hovering = true; layout(); });
  stack.addEventListener("pointerleave", () => { hovering = false; layout(); });
  function swipe(t) {
    let sx = 0, st = 0;
    t.el.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; t.dragging = true; sx = e.clientX; st = performance.now(); t.el.setPointerCapture(e.pointerId); t.el.style.transition = "none"; });
    t.el.addEventListener("pointermove", (e) => { if (!t.dragging) return; const dx = e.clientX - sx; t.dragX = dx > 0 ? dx : dx * .2; layout(); });
    t.el.addEventListener("pointerup", (e) => {
      if (!t.dragging) return; t.dragging = false; t.el.style.transition = "";
      const dx = e.clientX - sx, v = dx / (performance.now() - st);
      if (dx > 100 || v > .5) dismiss(t, innerWidth); else { t.dragX = 0; layout(); }
    });
  }
  const samples = {
    default: () => toast({ title: "Event created", desc: "Sunday, December 3 at 9:00 AM" }),
    success: () => toast({ type: "success", title: "Saved", desc: "All changes synced." }),
    error: () => toast({ type: "error", title: "Upload failed", desc: "File is larger than 10 MB." }),
    action: () => toast({ title: "Message archived", desc: "1 conversation moved.", action: { label: "Undo", onClick: () => toast({ type: "success", title: "Restored" }) } }),
    promise: () => { const h = toast({ type: "loading", title: "Deploying…", desc: "Building and uploading assets" }); setTimeout(() => (Math.random() < .75 ? h.update({ type: "success", title: "Deployed!", desc: "Live in 2.4s" }) : h.update({ type: "error", title: "Deploy failed", desc: "Build error on line 42" })), 2200); },
  };
  document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = samples[b.dataset.t]));
  setTimeout(samples.success, 400); setTimeout(samples.default, 900);
</script>
</body>
</html>
