<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smooth Height Accordion</title>
<meta name="description" content="An accordion built on native <details>/<summary> that animates to height: auto using interpolate-size: allow-keywords and the ::details-content pseudo-element, with exclusive groups via the name attribute, a rotating chevron, and a grid-rows fallback for older browsers.">
<meta name="tech" content="CSS, HTML details">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  :root { interpolate-size: allow-keywords; }
  main { max-width: 640px; margin: 0 auto; padding: 90px 20px 40px; }
  h1 { margin: 0 0 6px; } .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .acc { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--bg-2); }
  details + details { border-top: 1px solid var(--line); }
  summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; font-weight: 650; }
  summary::-webkit-details-marker { display: none; }
  summary .n { font: 600 12px var(--mono); color: var(--accent); }
  summary .chev { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .05); transition: rotate .35s cubic-bezier(.3, 1.4, .5, 1), background .2s; }
  details[open] summary .chev { rotate: 180deg; background: var(--accent); }
  summary:hover { background: rgb(255 255 255 / .03); }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The animation: ::details-content goes from block-size 0 to auto (needs interpolate-size) */
  details::details-content { block-size: 0; overflow: hidden; transition: block-size .45s cubic-bezier(.2, .8, .2, 1), content-visibility .45s allow-discrete; }
  details[open]::details-content { block-size: auto; }
  .body { padding: 0 20px 20px 52px; color: var(--muted); line-height: 1.6; }
  .body p { margin: 0; opacity: 0; translate: 0 -6px; transition: opacity .35s .1s, translate .35s .1s; }
  details[open] .body p { opacity: 1; translate: 0 0; }
  .note { margin-top: 16px; font-size: 12px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { details::details-content, .body p, summary .chev { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Questions, smoothly answered</h1>
  <p class="sub">Only one item opens at a time (the <code>name</code> attribute). Height animates to <code>auto</code> with no JavaScript.</p>
  <div class="acc"></div>
  <p class="note"></p>
</main>
<script src="../../assets/demo.js"></script>
<script>
  const QA = [["How does it animate to height: auto?", "interpolate-size: allow-keywords lets the browser interpolate between 0 and the intrinsic 'auto' size, and ::details-content is the box that holds the expandable content."],
    ["What happens in older browsers?", "They simply open and close instantly. The <details> element still works perfectly, so nothing breaks."],
    ["Is it accessible?", "Yes. <summary> is a real button with the right role and expanded state, and keyboard support comes for free."],
    ["Can several be open at once?", "Remove the shared name attribute and each item becomes independent."],
    ["Does it need JavaScript?", "No. The script on this page only fills in the demo text and checks support."]];
  document.querySelector(".acc").innerHTML = QA.map(([q, a], i) => `<details name="faq"${i === 0 ? " open" : ""}><summary><span class="n">0${i + 1}</span>${q}<span class="chev" aria-hidden="true">⌄</span></summary><div class="body"><p></p></div></details>`).join("");
  document.querySelectorAll(".body p").forEach((p, i) => (p.textContent = QA[i][1] + " " + Demo.lorem(18 + i * 6, i)));
  const ok = CSS.supports("interpolate-size: allow-keywords") && CSS.supports("selector(::details-content)");
  document.querySelector(".note").textContent = ok ? "✓ Your browser animates this natively." : "Your browser lacks interpolate-size / ::details-content, so items open instantly (still fully functional).";
</script>
</body>
</html>
