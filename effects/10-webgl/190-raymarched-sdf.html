<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raymarched SDF Blobs</title>
<meta name="description" content="A fully procedural 3D scene in one fragment shader: signed distance functions smoothly merge orbiting blobs into a glossy liquid, with soft shadows, ambient occlusion and fresnel rim lighting.">
<meta name="tech" content="WebGL">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style> canvas { position: fixed; inset: 0; width: 100%; height: 100%; } </style>
</head>
<body>
<canvas aria-label="Raymarched liquid metal blobs. Move the pointer to orbit the camera."></canvas>

<script src="../../assets/demo.js"></script>
<script src="../../assets/gl.js"></script>
<script>
  const FRAG = `
    uniform vec2 u_res; uniform float u_time; uniform vec4 u_mouse;
    float smin(float a, float b, float k){ float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
    float scene(vec3 p){
      float t = u_time * .7;
      float d = length(p) - 1.;
      for (int i = 0; i < 5; i++){
        float fi = float(i);
        vec3 c = vec3(sin(t * (.6 + fi * .13) + fi * 2.1), cos(t * (.5 + fi * .11) + fi), sin(t * (.4 + fi * .17) + fi * 4.)) * 1.5;
        d = smin(d, length(p - c) - (.35 + .08 * fi), .6);     // smooth union = liquid merge
      }
      return min(d, p.y + 2.2);                                 // floor
    }
    vec3 normal(vec3 p){ vec2 e = vec2(.001, 0); return normalize(vec3(scene(p + e.xyy) - scene(p - e.xyy), scene(p + e.yxy) - scene(p - e.yxy), scene(p + e.yyx) - scene(p - e.yyx))); }
    float shadow(vec3 ro, vec3 rd){ float res = 1., t = .05; for (int i = 0; i < 40; i++){ float h = scene(ro + rd * t); res = min(res, 10. * h / t); t += clamp(h, .02, .3); if (h < .001 || t > 8.) break; } return clamp(res, 0., 1.); }
    float ao(vec3 p, vec3 n){ float o = 0., s = 1.; for (int i = 1; i <= 5; i++){ float h = .06 * float(i); o += (h - scene(p + n * h)) * s; s *= .7; } return clamp(1. - 2.5 * o, 0., 1.); }
    void main(){
      vec2 uv = (gl_FragCoord.xy - .5 * u_res) / u_res.y;
      float ang = (u_mouse.x / u_res.x - .5) * 3. + u_time * .1, el = (u_mouse.y / u_res.y - .5) * 1.2 + .25;
      vec3 ro = vec3(sin(ang) * 6., 1.5 + el * 4., cos(ang) * 6.), ta = vec3(0);
      vec3 f = normalize(ta - ro), r = normalize(cross(vec3(0, 1, 0), f)), u = cross(f, r);
      vec3 rd = normalize(f * 1.6 + uv.x * r + uv.y * u);
      float t = 0.; bool hit = false;
      for (int i = 0; i < 120; i++){ float d = scene(ro + rd * t); if (d < .001){ hit = true; break; } t += d; if (t > 30.) break; }
      vec3 bg = mix(vec3(.04, .03, .09), vec3(.16, .08, .22), uv.y + .5);
      vec3 col = bg;
      if (hit){
        vec3 p = ro + rd * t, n = normal(p);
        vec3 L = normalize(vec3(.6, .8, .4));
        float diff = max(dot(n, L), 0.) * shadow(p + n * .01, L);
        float spec = pow(max(dot(reflect(rd, n), L), 0.), 60.);
        float fres = pow(1. - max(dot(n, -rd), 0.), 4.);
        bool floorHit = p.y < -2.19;
        vec3 base = floorHit ? vec3(.1, .08, .14) * (.6 + .4 * mod(floor(p.x) + floor(p.z), 2.)) : mix(vec3(.55, .25, 1.), vec3(.1, .8, 1.), .5 + .5 * n.y);
        float occ = ao(p, n);
        col = base * (.15 + diff) * occ + spec * vec3(1) * (floorHit ? .2 : 1.) + fres * vec3(1., .5, .9) * (floorHit ? 0. : .8);
        col = mix(col, bg, 1. - exp(-.004 * t * t));            // distance fog
      }
      o = vec4(pow(col, vec3(.4545)), 1.);
    }`;
  GL.fullscreen(document.querySelector("canvas"), FRAG, { dpr: 1 });
</script>
</body>
</html>
