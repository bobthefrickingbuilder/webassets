<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Product Viewer</title>
<meta name="description" content="An e-commerce 3D viewer for a procedurally modelled smartwatch: orbit and zoom, swap strap colours, and click hotspots that fly the camera to features with HTML annotations tracking the model.">
<meta name="tech" content="WebGL, Three.js">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: radial-gradient(circle at 50% 40%, #f8fafc, #cbd5e1); color: #0f172a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .hot { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; background: rgb(15 23 42 / .75); color: #fff; font: 700 14px var(--font); cursor: pointer; display: grid; place-items: center; transition: opacity .3s; box-shadow: 0 0 0 0 rgb(59 130 246 / .6); animation: ping 2s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 12px rgb(59 130 246 / 0); } 100% { box-shadow: 0 0 0 0 rgb(59 130 246 / 0); } }
  .hot.hidden { opacity: .15; pointer-events: none; }
  .note { position: fixed; left: 24px; top: 70px; max-width: 280px; padding: 16px 18px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgb(15 23 42 / .15); opacity: 0; transform: translateY(8px); transition: all .35s; }
  .note.on { opacity: 1; transform: none; }
  .note h3 { margin: 0 0 6px; } .note p { margin: 0; color: #475569; font-size: 14px; }
  .bar { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-radius: 999px; background: #fff; box-shadow: 0 10px 30px rgb(15 23 42 / .15); }
  .bar button.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; outline: 2px solid transparent; cursor: pointer; }
  .bar button.sw[aria-pressed="true"] { outline-color: #0f172a; }
  .bar .reset { border: 0; background: none; cursor: pointer; font-weight: 600; color: #0f172a; }
  .demo-bar { color: #eef0f6; }
</style>
</head>
<body>
<canvas aria-label="3D model of a smartwatch. Drag to rotate, scroll to zoom."></canvas>
<div class="note" aria-live="polite"><h3></h3><p></p></div>
<div class="bar" role="group" aria-label="Strap colour"></div>

<script src="../../assets/demo.js"></script>
<script src="../../assets/vendor/three/three.min.js"></script>
<script src="../../assets/three-kit.js"></script>
<script>
  const kit = ThreeKit.app({ position: [2.6, 1.2, 4.2], fov: 35, alpha: true, alwaysAnimate: true });
  const { scene, camera, renderer } = kit;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  scene.environment = ThreeKit.studioEnv(renderer);
  const controls = ThreeKit.orbit(camera, renderer.domElement, { autoRotate: 0.003, minDistance: 2.2, maxDistance: 9 });
  // Lighting: soft key, rim and fill, plus a shadow catcher under the product.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x93c5fd, 1.5); rim.position.set(-4, 2, -3); scene.add(rim);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshBasicMaterial({ map: (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "rgba(15,23,42,.35)"); gr.addColorStop(1, "rgba(15,23,42,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })(), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.35; scene.add(shadow);

  // --- Procedural watch ---
  const watch = new THREE.Group(); scene.add(watch);
  const metal = new THREE.MeshStandardMaterial({ color: 0xd4d4d8, metalness: 1, roughness: 0.25 });
  const caseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.28, 64), metal);
  caseMesh.rotation.x = Math.PI / 2; watch.add(caseMesh);
  const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.05, 16, 64), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: .6, roughness: .3 }));
  bezel.position.z = 0.14; watch.add(bezel);
  // Watch face drawn on a canvas so it can show the live time.
  const faceCanvas = document.createElement("canvas"); faceCanvas.width = faceCanvas.height = 512;
  const faceTex = new THREE.CanvasTexture(faceCanvas); faceTex.colorSpace = THREE.SRGBColorSpace;
  function drawFace() {
    const g = faceCanvas.getContext("2d"), d = new Date();
    g.fillStyle = "#0b1020"; g.fillRect(0, 0, 512, 512);
    const gr = g.createRadialGradient(256, 256, 40, 256, 256, 256); gr.addColorStop(0, "#1e3a8a"); gr.addColorStop(1, "#020617"); g.fillStyle = gr; g.beginPath(); g.arc(256, 256, 256, 0, 6.283); g.fill();
    g.strokeStyle = "#93c5fd"; g.lineWidth = 6;
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(256 + Math.cos(a) * 200, 256 + Math.sin(a) * 200); g.lineTo(256 + Math.cos(a) * 230, 256 + Math.sin(a) * 230); g.stroke(); }
    const hand = (a, len, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.beginPath(); g.moveTo(256, 256); g.lineTo(256 + Math.sin(a) * len, 256 - Math.cos(a) * len); g.stroke(); };
    hand((d.getHours() % 12 + d.getMinutes() / 60) * Math.PI / 6, 120, 14, "#e2e8f0");
    hand((d.getMinutes() + d.getSeconds() / 60) * Math.PI / 30, 180, 9, "#e2e8f0");
    hand((d.getSeconds() + d.getMilliseconds() / 1000) * Math.PI / 30, 200, 3, "#f97316");
    g.fillStyle = "#93c5fd"; g.font = "600 34px system-ui"; g.textAlign = "center"; g.fillText("ORBIT", 256, 360);
    faceTex.needsUpdate = true;
  }
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.64, 64), new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.15, metalness: 0, emissive: 0xffffff, emissiveMap: faceTex, emissiveIntensity: 0.6 }));
  face.position.z = 0.141; watch.add(face);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.66, 64), new THREE.MeshPhysicalMaterial({ transparent: true, opacity: 0.12, roughness: 0, clearcoat: 1 }));
  glass.position.z = 0.16; watch.add(glass);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.14, 24), metal);
  crown.rotation.z = Math.PI / 2; crown.position.x = 0.79; watch.add(crown);
  const strapMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
  for (const s of [1, -1]) {
    // Each strap half: a curved band built from a bent box.
    const geo = new THREE.BoxGeometry(0.62, 1.4, 0.09, 1, 24, 1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) + 0.7, bend = y * y * 0.35; pos.setY(i, (y + 0.62) * s); pos.setZ(i, pos.getZ(i) - bend); }
    geo.computeVertexNormals();
    watch.add(new THREE.Mesh(geo, strapMat));
  }
  watch.rotation.x = -0.25;

  // --- Hotspots: 3D anchor points projected to screen every frame. ---
  const spots = [
    { id: 1, pos: new THREE.Vector3(0, 0.25, 0.2), cam: [0.2, 0.6, 2.4], title: "Always-on display", text: "Sapphire glass over a 2,000-nit panel. It shows your real local time." },
    { id: 2, pos: new THREE.Vector3(0.86, 0, 0), cam: [2.4, 0.3, 0.6], title: "Digital crown", text: "Haptic detents make scrolling feel mechanical." },
    { id: 3, pos: new THREE.Vector3(0, -1.2, -0.3), cam: [0.5, -1.6, 2.6], title: "Fluoro-elastomer strap", text: "Sweat-proof and swappable in seconds." },
  ];
  const note = document.querySelector(".note");
  spots.forEach((s) => {
    const b = document.createElement("button"); b.className = "hot"; b.textContent = s.id; b.setAttribute("aria-label", s.title);
    b.onclick = () => { flyTo(s.cam); note.querySelector("h3").textContent = s.title; note.querySelector("p").textContent = s.text; note.classList.add("on"); controls.autoRotate = 0; };
    document.body.appendChild(b); s.el = b;
  });
  let fly = null;
  function flyTo(p) { fly = { from: camera.position.clone(), to: new THREE.Vector3(...p), t: 0 }; }
  const swatches = { Midnight: 0x1e293b, Coral: 0xfb7185, Sage: 0x86efac, Sky: 0x7dd3fc, Sand: 0xe7d3b1 };
  const bar = document.querySelector(".bar");
  Object.entries(swatches).forEach(([n, c], i) => {
    const b = document.createElement("button"); b.className = "sw"; b.style.background = "#" + c.toString(16).padStart(6, "0"); b.setAttribute("aria-label", n); b.setAttribute("aria-pressed", i === 0);
    b.onclick = () => { target.setHex(c); bar.querySelectorAll(".sw").forEach((x) => x.setAttribute("aria-pressed", x === b)); };
    bar.appendChild(b);
  });
  const reset = document.createElement("button"); reset.className = "reset"; reset.textContent = "Reset view";
  reset.onclick = () => { flyTo([2.6, 1.2, 4.2]); note.classList.remove("on"); controls.autoRotate = 0.003; }; bar.appendChild(reset);
  const target = new THREE.Color(0x1e293b);
  const tmp = new THREE.Vector3(), camDir = new THREE.Vector3();
  kit.onFrame((t, dt) => {
    if (fly) {
      fly.t = Math.min(1, fly.t + dt * 1.4); const e = 1 - Math.pow(1 - fly.t, 3);
      camera.position.lerpVectors(fly.from, fly.to, e); camera.lookAt(0, 0, 0);
      if (fly.t >= 1) { fly = null; controls.sync(); }
    } else controls.update();
    strapMat.color.lerp(target, 0.08);
    drawFace();   // redrawn every frame so the second hand sweeps smoothly
    // Position hotspot buttons; dim the ones on the far side of the model.
    camera.getWorldDirection(camDir);
    for (const s of spots) {
      tmp.copy(s.pos).applyMatrix4(watch.matrixWorld);
      const toSpot = tmp.clone().sub(camera.position).normalize();
      const facing = tmp.clone().normalize().dot(toSpot.negate()) > -0.1;
      tmp.project(camera);
      s.el.style.left = (tmp.x * .5 + .5) * innerWidth + "px"; s.el.style.top = (-tmp.y * .5 + .5) * innerHeight + "px";
      s.el.classList.toggle("hidden", !facing);
    }
  }).start();
</script>
</body>
</html>
