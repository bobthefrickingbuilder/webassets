<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA Helix Loader</title>
<meta name="description" content="A rotating double helix built from pairs of dots and rungs; each pair is phase-shifted so the strands appear to twist in 3D, with depth-based size and opacity.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .helix { display: flex; gap: 10px; height: 120px; align-items: center; }
  .helix .pair { position: relative; width: 12px; height: 100%; }
  .helix .a, .helix .b { position: absolute; left: 0; width: 12px; height: 12px; border-radius: 50%; animation: strand 2s ease-in-out infinite; animation-delay: var(--d); }
  .helix .a { background: #22d3ee; } .helix .b { background: #f472b6; animation-name: strand-b; }
  .helix .rung { position: absolute; left: 5px; width: 2px; background: rgb(255 255 255 / .2); animation: rung 2s ease-in-out infinite; animation-delay: var(--d); }
  /* Strand A goes top→bottom while B goes bottom→top; scale/opacity fake depth at the crossings. */
  @keyframes strand { 0%, 100% { top: 0; transform: scale(1); opacity: 1; z-index: 2; } 25% { transform: scale(.6); opacity: .5; } 50% { top: calc(100% - 12px); transform: scale(1); opacity: 1; } 75% { transform: scale(1.3); opacity: 1; z-index: 2; } }
  @keyframes strand-b { 0%, 100% { top: calc(100% - 12px); transform: scale(1); } 25% { transform: scale(1.3); } 50% { top: 0; transform: scale(1); } 75% { transform: scale(.6); opacity: .5; } }
  @keyframes rung { 0%, 100% { top: 6px; bottom: 6px; } 50% { top: 6px; bottom: 6px; } 25%, 75% { top: 50%; bottom: 50%; } }
  @media (prefers-reduced-motion: reduce) { .helix * { animation-duration: 6s !important; } }
</style>
</head>
<body>
<main class="center"><div class="helix" role="status" aria-label="Loading"></div></main>

<script src="../../assets/demo.js"></script>
<script>
  const helix = document.querySelector(".helix");
  for (let i = 0; i < 14; i++) helix.insertAdjacentHTML("beforeend", `<div class="pair" style="--d:${-i * 0.15}s"><span class="rung"></span><span class="a"></span><span class="b"></span></div>`);
</script>
</body>
</html>
