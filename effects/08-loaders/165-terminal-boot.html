<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glitchy Terminal Boot Sequence</title>
<meta name="description" content="A hacker-movie boot loader: log lines stream in with [ OK ] statuses, an ASCII progress bar fills, the screen glitches, and it resolves into 'ACCESS GRANTED'.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: #020403; }
  .term { width: min(760px, 94vw); height: 70vh; overflow: hidden; font: 14px/1.6 var(--mono); color: #4ade80; text-shadow: 0 0 6px rgb(74 222 128 / .5); white-space: pre-wrap; }
  .term .ok { color: #a3e635; } .term .warn { color: #facc15; } .term .dim { color: #166534; }
  .term.glitch { animation: glitch .45s steps(2) 2; }
  @keyframes glitch { 0% { transform: translate(2px, -1px); filter: hue-rotate(90deg); clip-path: inset(10% 0 60% 0); } 25% { transform: translate(-3px, 2px); clip-path: inset(50% 0 20% 0); } 50% { transform: translate(1px, 1px); filter: none; clip-path: inset(0); } 75% { transform: translate(-1px, -2px); clip-path: inset(30% 0 40% 0); } }
  .granted { position: fixed; inset: 0; display: grid; place-items: center; font: 800 clamp(32px, 7vw, 90px) var(--mono); color: #4ade80; letter-spacing: .1em; text-shadow: 0 0 30px #22c55e; opacity: 0; pointer-events: none; transition: opacity .3s; background: rgb(2 4 3 / .85); }
  .granted.show { opacity: 1; animation: flash .2s steps(1) 3; }
  @keyframes flash { 50% { opacity: .2; } }
  .again { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border: 1px solid #166534; background: none; color: #4ade80; font: 13px var(--mono); cursor: pointer; }
</style>
</head>
<body>
<main class="center"><div class="term" role="log" aria-live="polite"></div></main>
<div class="granted">ACCESS GRANTED</div>
<button class="again">reboot</button>

<script src="../../assets/demo.js"></script>
<script>
  const term = document.querySelector(".term"), granted = document.querySelector(".granted");
  const LINES = ["Initializing kernel v6.6.6", "Mounting /dev/sda1", "Loading modules: crypto, net, gpu", "Checking integrity of 250 effects", "Starting network daemon", "Negotiating secure handshake", "Decrypting payload", "Bypassing firewall (just kidding)", "Spawning shell"];
  const sleep = (ms) => new Promise((r) => setTimeout(r, Demo.reduced ? 0 : ms));
  const add = (html) => { term.insertAdjacentHTML("beforeend", html); term.scrollTop = term.scrollHeight; };
  async function boot() {
    term.innerHTML = ""; granted.classList.remove("show");
    add('<span class="dim">WEBASSETS BIOS (C) 2026 · press DEL to enter setup</span>\n\n');
    for (const l of LINES) {
      const id = "s" + Math.random().toString(36).slice(2);
      add(`${l}… <span id="${id}" class="dim">[ .... ]</span>\n`);
      await sleep(120 + Math.random() * 380);
      const warn = Math.random() < 0.12;
      document.getElementById(id).outerHTML = warn ? '<span class="warn">[ WARN ]</span>' : '<span class="ok">[  OK  ]</span>';
    }
    add("\n");
    const id = "bar" + Date.now();
    add(`<span id="${id}"></span>\n`);
    const bar = document.getElementById(id);
    for (let p = 0; p <= 100; p += 2 + Math.floor(Math.random() * 4)) {
      const n = Math.round(p / 4);
      bar.textContent = `[${"#".repeat(n)}${".".repeat(25 - n)}] ${Math.min(100, p)}%`;
      await sleep(40);
    }
    bar.textContent = `[${"#".repeat(25)}] 100%`;
    await sleep(300);
    term.classList.add("glitch");
    await sleep(900);
    term.classList.remove("glitch");
    granted.classList.add("show");
  }
  document.querySelector(".again").onclick = boot;
  boot();
</script>
</body>
</html>
