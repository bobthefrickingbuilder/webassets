<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouncing Ball Loader</title>
<meta name="description" content="A cartoon physics loader: a ball falls with gravity easing, squashes on impact, stretches on the way up, and its shadow scales with height. Three staggered variants.">
<meta name="tech" content="CSS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .bounce { position: relative; width: 60px; height: 140px; }
  .bounce .ball { position: absolute; left: 10px; top: 0; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--c) 30%, color-mix(in srgb, var(--c) 60%, #000)); transform-origin: 50% 100%;
                  animation: fall .9s cubic-bezier(.45,0,.9,.6) infinite alternate, squash .9s infinite alternate; }
  .bounce .shadow { position: absolute; left: 8px; bottom: 0; width: 44px; height: 8px; border-radius: 50%; background: rgb(0 0 0 / .55); animation: shadow .9s cubic-bezier(.45,0,.9,.6) infinite alternate; }
  /* fall eases in (accelerating), so the alternate direction rises decelerating: real gravity. */
  @keyframes fall { from { top: 0; } to { top: 92px; } }
  @keyframes squash { 0%, 85% { transform: scale(1, 1.08); } 100% { transform: scale(1.35, .7); } }
  @keyframes shadow { from { transform: scale(.4); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  .row { gap: 40px; }
  .bounce:nth-child(1) { --c: #22d3ee; } .bounce:nth-child(2) { --c: #a78bfa; } .bounce:nth-child(3) { --c: #f472b6; }
  .bounce:nth-child(2) * { animation-delay: -.3s; } .bounce:nth-child(3) * { animation-delay: -.6s; }
  @media (prefers-reduced-motion: reduce) { .bounce * { animation-duration: 3s !important; } }
</style>
</head>
<body>
<main class="center"><div class="row" role="status" aria-label="Loading">
  <div class="bounce"><div class="ball"></div><div class="shadow"></div></div>
  <div class="bounce"><div class="ball"></div><div class="shadow"></div></div>
  <div class="bounce"><div class="ball"></div><div class="shadow"></div></div>
</div></main>
<script src="../../assets/demo.js"></script>
</body>
</html>
