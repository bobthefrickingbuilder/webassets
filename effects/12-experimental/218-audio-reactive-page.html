<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio-reactive Page</title>
<meta name="description" content="A whole landing page that dances: an AnalyserNode writes bass, mid, treble and beat values into CSS custom properties every frame, and ordinary CSS scales the headline, glows buttons, bends a gradient and bounces equaliser bars. Built-in beat or your mic.">
<meta name="tech" content="Web Audio, CSS variables">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  :root { --bass: 0; --mid: 0; --high: 0; --beat: 0; }
  body { min-height: 100vh; overflow-x: hidden; background: radial-gradient(circle at 50% calc(40% - var(--bass) * 10%), hsl(calc(260 + var(--mid) * 80) 80% calc(18% + var(--bass) * 20%)), #07060d 70%); }
  main { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 20px; padding: 80px 20px; }
  h1 { margin: 0; font-size: clamp(48px, 10vw, 140px); letter-spacing: -.05em; line-height: .9; transform: scale(calc(1 + var(--bass) * .12)) skewX(calc(var(--high) * -8deg)); text-shadow: 0 0 calc(var(--beat) * 60px) hsl(300 100% 70%); }
  p { color: #c9c3e6; margin: 0; letter-spacing: calc(var(--mid) * .3em); transition: letter-spacing .1s; }
  .bars { display: flex; gap: 6px; height: 120px; align-items: flex-end; justify-content: center; }
  .bars i { width: 14px; border-radius: 7px 7px 3px 3px; background: linear-gradient(#ff7ad9, #7c5cff); height: calc(6px + var(--v, 0) * 114px); }
  .cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .cta button { padding: 14px 24px; border-radius: 999px; border: 0; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 0 calc(var(--beat) * 40px) hsl(190 100% 60%); transform: translateY(calc(var(--beat) * -6px)); }
  .cta .play { background: #fff; color: #000; }
  .cta .mic { background: rgb(255 255 255 / .1); color: #fff; }
  .ring { position: fixed; left: 50%; top: 40%; width: 60vmin; height: 60vmin; border-radius: 50%; border: 2px solid hsl(190 100% 70% / calc(var(--beat) * .8)); transform: translate(-50%, -50%) scale(calc(.8 + var(--beat) * .5)); pointer-events: none; }
</style>
</head>
<body>
<div class="ring" aria-hidden="true"></div>
<main>
  <h1>Feel the<br>page.</h1>
  <p>Every pixel is driven by four CSS variables.</p>
  <div class="bars" aria-hidden="true"></div>
  <div class="cta"><button class="play">▶ Play beat</button><button class="mic">🎙 Use mic</button></div>
</main>

<script src="../../assets/demo.js"></script>
<script>
  const root = document.documentElement.style, bars = document.querySelector(".bars");
  const BARS = 16; for (let i = 0; i < BARS; i++) bars.appendChild(document.createElement("i"));
  let ctx, an, data, src = null, playing = false;
  function setup() { if (ctx) return; ctx = new AudioContext(); an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = .7; data = new Uint8Array(an.frequencyBinCount); }
  // A four-on-the-floor beat with bass, clap and a chord stab, scheduled ahead on the audio clock.
  function beat() {
    const out = ctx.createGain(); out.gain.value = .4; out.connect(an); an.connect(ctx.destination);
    let next = ctx.currentTime + .05, step = 0, live = true; const spb = 60 / 124 / 2;
    const env = (node, t, v, d) => { node.gain.setValueAtTime(v, t); node.gain.exponentialRampToValueAtTime(.001, t + d); };
    const noise = ctx.createBuffer(1, ctx.sampleRate * .2, ctx.sampleRate); noise.getChannelData(0).forEach((_, i, a) => (a[i] = Math.random() * 2 - 1));
    (function sched() {
      if (!live) return;
      while (next < ctx.currentTime + .12) {
        if (step % 2 === 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, next); o.frequency.exponentialRampToValueAtTime(45, next + .12); env(g, next, 1, .3); o.connect(g).connect(out); o.start(next); o.stop(next + .3); }
        if (step % 4 === 2) { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; f.type = "bandpass"; f.frequency.value = 1500; env(g, next, .6, .15); s.connect(f).connect(g).connect(out); s.start(next); }
        if (step % 8 === 3 || step % 8 === 6) [0, 4, 7].forEach((n) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sawtooth"; o.frequency.value = 220 * Math.pow(2, (n + [0, 5, 3, 7][(step >> 4) % 4]) / 12); env(g, next, .07, .25); o.connect(g).connect(out); o.start(next); o.stop(next + .3); });
        { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.value = 55 * Math.pow(2, [0, 0, 5, 3][(step >> 4) % 4] / 12); env(g, next, .12, .12); o.connect(g).connect(out); o.start(next); o.stop(next + .15); }
        next += spb; step++;
      }
      setTimeout(sched, 25);
    })();
    return { stop() { live = false; out.disconnect(); try { an.disconnect(); } catch {} } };
  }
  const playBtn = document.querySelector(".play"), micBtn = document.querySelector(".mic");
  function stopAll() { if (src) { src.stop(); src = null; } playBtn.textContent = "▶ Play beat"; micBtn.textContent = "🎙 Use mic"; playing = false; }
  playBtn.onclick = async () => { const was = src && src.kind === "beat"; stopAll(); if (was) return; setup(); await ctx.resume(); src = beat(); src.kind = "beat"; playBtn.textContent = "■ Stop"; playing = true; };
  micBtn.onclick = async () => {
    const was = src && src.kind === "mic"; stopAll(); if (was) return; setup();
    try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const node = ctx.createMediaStreamSource(stream); node.connect(an); await ctx.resume();
      src = { kind: "mic", stop() { node.disconnect(); stream.getTracks().forEach((t) => t.stop()); } }; micBtn.textContent = "■ Stop mic"; playing = true;
    } catch (e) { micBtn.textContent = "Mic unavailable"; }
  };
  let avgBass = 0, beatV = 0, t0 = performance.now();
  function frame(now) {
    let bass, mid, high, bands = [];
    if (playing) {
      an.getByteFrequencyData(data);
      const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += data[i]; return s / (b - a) / 255; };
      bass = avg(1, 6); mid = avg(6, 30); high = avg(30, 90);
      for (let i = 0; i < BARS; i++) bands.push(avg(1 + Math.floor(Math.pow(i / BARS, 1.6) * 100), 2 + Math.floor(Math.pow((i + 1) / BARS, 1.6) * 100)));
    } else {
      // idle: a slow breathing so the page isn't static
      const t = (now - t0) / 1000, k = Demo.reduced ? 0 : 1;
      bass = .2 + .15 * Math.sin(t * 2) * k; mid = .2; high = .05; bands = Array.from({ length: BARS }, (_, i) => .15 + .1 * Math.sin(t * 2 + i * .5) * k);
    }
    // beat detector: bass jumping above its running average
    avgBass += (bass - avgBass) * .05;
    if (bass > avgBass * 1.25 && bass > .3) beatV = 1; beatV *= .88;
    root.setProperty("--bass", bass.toFixed(3)); root.setProperty("--mid", mid.toFixed(3)); root.setProperty("--high", high.toFixed(3)); root.setProperty("--beat", beatV.toFixed(3));
    bars.childNodes.forEach((b, i) => b.style.setProperty("--v", bands[i].toFixed(3)));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
