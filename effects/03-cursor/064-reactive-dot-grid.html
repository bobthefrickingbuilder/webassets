<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursor-reactive Dot Grid</title>
<meta name="description" content="A field of dots that bulge, brighten and push away around the pointer; click to send a shockwave ripple across the grid.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="2">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .label { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 800 clamp(36px, 6vw, 80px)/1 var(--font); letter-spacing: -.04em; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<div class="label">Click for a shockwave</div>

<script src="../../assets/demo.js"></script>
<script>
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let W, H, dpr, dots = [];
  const GAP = 28, R = 150;
  const m = { x: -1e4, y: -1e4 }, waves = [];
  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    dots = [];
    const g = GAP * dpr;
    for (let y = g / 2; y < H; y += g) for (let x = g / 2; x < W; x += g) dots.push({ hx: x, hy: y, x, y, vx: 0, vy: 0 });
  }
  addEventListener("resize", build); build();
  addEventListener("pointermove", (e) => { m.x = e.clientX * dpr; m.y = e.clientY * dpr; });
  addEventListener("pointerdown", (e) => waves.push({ x: e.clientX * dpr, y: e.clientY * dpr, r: 0 }));
  document.addEventListener("pointerleave", () => { m.x = m.y = -1e4; });

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const w of waves) w.r += 14 * dpr;
    while (waves.length && waves[0].r > Math.hypot(W, H)) waves.shift();
    const RR = R * dpr;
    for (const d of dots) {
      const dx = d.hx - m.x, dy = d.hy - m.y, dist = Math.hypot(dx, dy);
      let k = 0;
      if (dist < RR) {
        k = 1 - dist / RR;
        d.vx += (dx / (dist || 1)) * k * 2.2; d.vy += (dy / (dist || 1)) * k * 2.2;
      }
      for (const w of waves) {
        const wd = Math.hypot(d.hx - w.x, d.hy - w.y), band = Math.abs(wd - w.r);
        if (band < 40 * dpr) { const f = (1 - band / (40 * dpr)) * 3 * Math.max(0, 1 - w.r / (900 * dpr)); d.vx += (d.hx - w.x) / (wd || 1) * f; d.vy += (d.hy - w.y) / (wd || 1) * f; k = Math.max(k, f / 3); }
      }
      d.vx += (d.hx - d.x) * 0.08; d.vy += (d.hy - d.y) * 0.08;
      d.vx *= 0.8; d.vy *= 0.8;
      d.x += d.vx; d.y += d.vy;
      const off = Math.min(1, Math.hypot(d.x - d.hx, d.y - d.hy) / (30 * dpr));
      ctx.fillStyle = off > 0.05 ? `hsl(${190 + off * 100}, 90%, ${45 + off * 35}%)` : "#2a2e3b";
      ctx.beginPath(); ctx.arc(d.x, d.y, (1.6 + off * 3) * dpr, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if (Demo.reduced) { frame(); } else requestAnimationFrame(frame);
</script>
</body>
</html>
