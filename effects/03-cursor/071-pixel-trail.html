<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Pixel Trail</title>
<meta name="description" content="The screen is a grid of chunky pixels; cells under the pointer light up in shifting hues and fade out, like an LED wall.">
<meta name="tech" content="Canvas, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .label { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 400 clamp(28px, 5vw, 64px)/1 var(--mono); letter-spacing: .1em; color: #fff; mix-blend-mode: difference; }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<div class="label">PIXEL TRAIL</div>

<script src="../../assets/demo.js"></script>
<script>
  const CELL = 24;
  const cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  let cols, rows, life, hues, hue = 0, lx = null, ly = null;
  function resize() {
    cols = Math.ceil(innerWidth / CELL); rows = Math.ceil(innerHeight / CELL);
    cv.width = cols; cv.height = rows;               // one canvas pixel per cell, upscaled crisply by CSS
    life = new Float32Array(cols * rows); hues = new Float32Array(cols * rows);
  }
  addEventListener("resize", resize); resize();
  function light(cx, cy) { if (cx >= 0 && cy >= 0 && cx < cols && cy < rows) { life[cy * cols + cx] = 1; hues[cy * cols + cx] = hue; } }
  addEventListener("pointermove", (e) => {
    const cx = Math.floor(e.clientX / CELL), cy = Math.floor(e.clientY / CELL);
    hue = (hue + 3) % 360;
    // Fill the cells between samples so fast moves leave an unbroken line (Bresenham-ish).
    if (lx !== null) { const n = Math.max(Math.abs(cx - lx), Math.abs(cy - ly)); for (let i = 0; i <= n; i++) light(Math.round(lx + (cx - lx) * i / (n || 1)), Math.round(ly + (cy - ly) * i / (n || 1))); }
    else light(cx, cy);
    lx = cx; ly = cy;
  });
  const img = () => ctx.createImageData(cols, rows);
  let data = img();
  function frame() {
    if (data.width !== cols || data.height !== rows) data = img();
    const d = data.data;
    for (let i = 0; i < life.length; i++) {
      const l = life[i];
      if (l > 0) life[i] = Math.max(0, l - 0.025);
      const h = hues[i] / 60, c = l, x = c * (1 - Math.abs((h % 2) - 1));
      let r = 0, g = 0, b = 0;
      if (h < 1) [r, g] = [c, x]; else if (h < 2) [r, g] = [x, c]; else if (h < 3) [g, b] = [c, x]; else if (h < 4) [g, b] = [x, c]; else if (h < 5) [r, b] = [x, c]; else [r, b] = [c, x];
      d[i * 4] = 18 + r * 237; d[i * 4 + 1] = 19 + g * 236; d[i * 4 + 2] = 26 + b * 229; d[i * 4 + 3] = 255;
    }
    ctx.putImageData(data, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
