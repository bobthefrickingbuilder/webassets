<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluid Simulation Cursor</title>
<meta name="description" content="A real-time GPU Navier-Stokes fluid (advection, vorticity confinement, pressure projection) stirred by the pointer, leaving swirling ink.">
<meta name="tech" content="WebGL">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .label { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 800 clamp(40px, 8vw, 110px)/1 var(--font); letter-spacing: -.05em; color: #fff; mix-blend-mode: difference; }
</style>
</head>
<body>
<canvas></canvas>
<div class="label">Stir the ink</div>

<script src="../../assets/demo.js"></script>
<script src="../../assets/gl.js"></script>
<script src="../../assets/fluid.js"></script>
<script>
(function () {
  const canvas = document.querySelector("canvas");
  const sim = FluidSim.create(canvas);
  if (!sim) return;
  const color = (h = (performance.now() / 3000) % 1) => FluidSim.hsv(h, 1, 0.18);

  const ptr = { x: 0, y: 0, dx: 0, dy: 0, moved: false };
  canvas.addEventListener("pointermove", (e) => {
    const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
    ptr.dx = (x - ptr.x) * 6000; ptr.dy = (y - ptr.y) * 6000;
    ptr.x = x; ptr.y = y; ptr.moved = true;
  });
  canvas.addEventListener("pointerdown", (e) => {
    const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; sim.splat(x, y, Math.cos(a) * 600, Math.sin(a) * 600, color().map((c) => c * 3)); }
  });
  addEventListener("resize", () => sim.resize());
  // A few random splats so the screen isn't empty before interaction.
  for (let i = 0; i < 8; i++) sim.splat(Math.random(), Math.random(), (Math.random() - .5) * 2000, (Math.random() - .5) * 2000, color(Math.random()).map((c) => c * 4));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    if (ptr.moved) { sim.splat(ptr.x, ptr.y, ptr.dx, ptr.dy, color()); ptr.moved = false; }
    sim.step(dt); sim.render();
    if (!Demo.reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (Demo.reduced) canvas.addEventListener("pointermove", () => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
