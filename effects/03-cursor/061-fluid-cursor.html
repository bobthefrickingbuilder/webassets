<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluid Simulation Cursor</title>
<meta name="description" content="A real-time GPU Navier-Stokes fluid (advection, vorticity confinement, pressure projection) stirred by the pointer, leaving swirling ink.">
<meta name="tech" content="WebGL">
<meta name="complexity" content="3">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  body { background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .label { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 800 clamp(40px, 8vw, 110px)/1 var(--font); letter-spacing: -.05em; color: #fff; mix-blend-mode: difference; }
</style>
</head>
<body>
<canvas></canvas>
<div class="label">Stir the ink</div>

<script src="../../assets/demo.js"></script>
<script src="../../assets/gl.js"></script>
<script>
(function () {
  const canvas = document.querySelector("canvas");
  const gl = GL.context(canvas, { alpha: false });
  if (!gl) return;

  const SHADERS = {
    splat: `uniform sampler2D u_target; uniform float u_aspect; uniform vec3 u_color; uniform vec2 u_point; uniform float u_radius;
      void main(){ vec2 p = v_uv - u_point; p.x *= u_aspect; vec3 s = exp(-dot(p,p)/u_radius) * u_color; o = vec4(texture(u_target, v_uv).xyz + s, 1.0); }`,
    advect: `uniform sampler2D u_velocity; uniform sampler2D u_source; uniform vec2 u_texel; uniform float u_dt; uniform float u_dissipation;
      void main(){ vec2 coord = v_uv - u_dt * texture(u_velocity, v_uv).xy * u_texel; o = texture(u_source, coord) / (1.0 + u_dissipation * u_dt); }`,
    divergence: `uniform sampler2D u_velocity; uniform vec2 u_texel;
      void main(){
        float L = texture(u_velocity, v_uv - vec2(u_texel.x, 0)).x, R = texture(u_velocity, v_uv + vec2(u_texel.x, 0)).x;
        float B = texture(u_velocity, v_uv - vec2(0, u_texel.y)).y, T = texture(u_velocity, v_uv + vec2(0, u_texel.y)).y;
        o = vec4(0.5 * (R - L + T - B), 0, 0, 1); }`,
    curl: `uniform sampler2D u_velocity; uniform vec2 u_texel;
      void main(){
        float L = texture(u_velocity, v_uv - vec2(u_texel.x, 0)).y, R = texture(u_velocity, v_uv + vec2(u_texel.x, 0)).y;
        float B = texture(u_velocity, v_uv - vec2(0, u_texel.y)).x, T = texture(u_velocity, v_uv + vec2(0, u_texel.y)).x;
        o = vec4(0.5 * (R - L - T + B), 0, 0, 1); }`,
    vorticity: `uniform sampler2D u_velocity; uniform sampler2D u_curl; uniform vec2 u_texel; uniform float u_strength; uniform float u_dt;
      void main(){
        float L = texture(u_curl, v_uv - vec2(u_texel.x, 0)).x, R = texture(u_curl, v_uv + vec2(u_texel.x, 0)).x;
        float B = texture(u_curl, v_uv - vec2(0, u_texel.y)).x, T = texture(u_curl, v_uv + vec2(0, u_texel.y)).x;
        float C = texture(u_curl, v_uv).x;
        vec2 f = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        f = f / (length(f) + 1e-4) * u_strength * C; f.y *= -1.0;
        vec2 v = texture(u_velocity, v_uv).xy + f * u_dt;
        o = vec4(clamp(v, -1000.0, 1000.0), 0, 1); }`,
    pressure: `uniform sampler2D u_pressure; uniform sampler2D u_divergence; uniform vec2 u_texel;
      void main(){
        float L = texture(u_pressure, v_uv - vec2(u_texel.x, 0)).x, R = texture(u_pressure, v_uv + vec2(u_texel.x, 0)).x;
        float B = texture(u_pressure, v_uv - vec2(0, u_texel.y)).x, T = texture(u_pressure, v_uv + vec2(0, u_texel.y)).x;
        o = vec4((L + R + B + T - texture(u_divergence, v_uv).x) * 0.25, 0, 0, 1); }`,
    gradient: `uniform sampler2D u_pressure; uniform sampler2D u_velocity; uniform vec2 u_texel;
      void main(){
        float L = texture(u_pressure, v_uv - vec2(u_texel.x, 0)).x, R = texture(u_pressure, v_uv + vec2(u_texel.x, 0)).x;
        float B = texture(u_pressure, v_uv - vec2(0, u_texel.y)).x, T = texture(u_pressure, v_uv + vec2(0, u_texel.y)).x;
        o = vec4(texture(u_velocity, v_uv).xy - vec2(R - L, T - B), 0, 1); }`,
    scale: `uniform sampler2D u_tex; uniform float u_value; void main(){ o = u_value * texture(u_tex, v_uv); }`,
    display: `uniform sampler2D u_tex;
      void main(){ vec3 c = texture(u_tex, v_uv).rgb; c = pow(c, vec3(0.85)); o = vec4(c, 1.0); }`,
  };
  const P = {};
  for (const k in SHADERS) P[k] = GL.program(gl, SHADERS[k]);

  const SIM = 128, DYE = 768;
  let vel, dye, pressure, divT, curlT, simTexel, dpr;
  function res(r) {
    const a = canvas.width / canvas.height, big = Math.round(r * Math.max(a, 1 / a));
    return a > 1 ? [big, r] : [r, big];
  }
  function init() {
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    const [sw, sh] = res(SIM), [dw, dh] = res(DYE);
    const f = { float: true };
    vel = GL.doubleTarget(gl, sw, sh, f); dye = GL.doubleTarget(gl, dw, dh, f); pressure = GL.doubleTarget(gl, sw, sh, f);
    divT = GL.target(gl, sw, sh, f); curlT = GL.target(gl, sw, sh, f);
    simTexel = [1 / sw, 1 / sh];
  }

  function splat(x, y, dx, dy, color) {
    const aspect = canvas.width / canvas.height;
    P.splat.use().set("u_target", vel.read).set("u_aspect", aspect).set("u_point", [x, y]).set("u_color", [dx, dy, 0]).set("u_radius", 0.0025);
    GL.draw(gl, vel.write); vel.swap();
    P.splat.use().set("u_target", dye.read).set("u_aspect", aspect).set("u_point", [x, y]).set("u_color", color).set("u_radius", 0.0025);
    GL.draw(gl, dye.write); dye.swap();
  }

  function step(dt) {
    P.curl.use().set("u_velocity", vel.read).set("u_texel", simTexel); GL.draw(gl, curlT);
    P.vorticity.use().set("u_velocity", vel.read).set("u_curl", curlT).set("u_texel", simTexel).set("u_strength", 28).set("u_dt", dt); GL.draw(gl, vel.write); vel.swap();
    P.divergence.use().set("u_velocity", vel.read).set("u_texel", simTexel); GL.draw(gl, divT);
    P.scale.use().set("u_tex", pressure.read).set("u_value", 0.8); GL.draw(gl, pressure.write); pressure.swap();
    for (let i = 0; i < 20; i++) { P.pressure.use().set("u_pressure", pressure.read).set("u_divergence", divT).set("u_texel", simTexel); GL.draw(gl, pressure.write); pressure.swap(); }
    P.gradient.use().set("u_pressure", pressure.read).set("u_velocity", vel.read).set("u_texel", simTexel); GL.draw(gl, vel.write); vel.swap();
    P.advect.use().set("u_velocity", vel.read).set("u_source", vel.read).set("u_texel", simTexel).set("u_dt", dt).set("u_dissipation", 0.2); GL.draw(gl, vel.write); vel.swap();
    P.advect.use().set("u_velocity", vel.read).set("u_source", dye.read).set("u_texel", simTexel).set("u_dt", dt).set("u_dissipation", 0.9); GL.draw(gl, dye.write); dye.swap();
  }

  function color(h = (performance.now() / 3000) % 1) {
    const s = 1, v = 0.18;
    const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  }

  const ptr = { x: 0, y: 0, moved: false, dx: 0, dy: 0 };
  canvas.addEventListener("pointermove", (e) => {
    const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
    ptr.dx = (x - ptr.x) * 6000; ptr.dy = (y - ptr.y) * 6000;
    ptr.x = x; ptr.y = y; ptr.moved = true;
  });
  canvas.addEventListener("pointerdown", (e) => {
    const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; splat(x, y, Math.cos(a) * 600, Math.sin(a) * 600, color().map((c) => c * 3)); }
  });

  init();
  addEventListener("resize", init);
  // A few random splats so the screen isn't empty before interaction.
  for (let i = 0; i < 8; i++) splat(Math.random(), Math.random(), (Math.random() - .5) * 2000, (Math.random() - .5) * 2000, color(Math.random()).map((c) => c * 4));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    if (ptr.moved) { splat(ptr.x, ptr.y, ptr.dx, ptr.dy, color()); ptr.moved = false; }
    step(dt);
    P.display.use().set("u_tex", dye.read); GL.draw(gl, null);
    if (!Demo.reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (Demo.reduced) canvas.addEventListener("pointermove", () => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
