<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full-screen Overlay Menu</title>
<meta name="description" content="A full-screen navigation overlay that slides down in layered panels, then staggers in huge links that rise from behind a mask, with focus trapping and Escape to close.">
<meta name="tech" content="CSS, JS">
<meta name="complexity" content="1">
<link rel="stylesheet" href="../../assets/demo.css">
<style>
  .menu-btn { position: fixed; top: 14px; right: 16px; z-index: 60; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; font-weight: 600; }
  .ovl { position: fixed; inset: 0; z-index: 50; visibility: hidden; transition: visibility 0s .9s; }
  .ovl.open { visibility: visible; transition: none; }
  .ovl .layer { position: absolute; inset: 0; transform: translateY(-100%); transition: transform .8s cubic-bezier(.77,0,.18,1); }
  .ovl .l1 { background: var(--accent); } .ovl .l2 { background: #15161c; transition-delay: .08s; }
  .ovl.open .layer { transform: none; }
  .ovl:not(.open) .l1 { transition-delay: .12s; } .ovl:not(.open) .l2 { transition-delay: 0s; }
  .ovl nav { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 8vw; gap: 1vh; }
  .ovl nav a { display: block; overflow: hidden; text-decoration: none; font-size: clamp(44px, 9vw, 120px); font-weight: 800; letter-spacing: -.05em; line-height: 1.05; }
  .ovl nav a span { display: inline-block; transform: translateY(110%); transition: transform .7s cubic-bezier(.2,.8,.2,1), color .3s; }
  .ovl.open nav a span { transform: none; transition-delay: calc(.45s + var(--i) * 70ms); }
  .ovl nav a:hover span, .ovl nav a:focus-visible span { color: var(--accent-2); }
  .ovl nav a sup { font: 500 14px var(--mono); color: var(--muted); vertical-align: top; margin-left: 8px; }
  .page { min-height: 100vh; display: grid; place-items: center; }
  @media (prefers-reduced-motion: reduce) { .ovl *, .ovl { transition-duration: .01s !important; transition-delay: 0s !important; } }
</style>
</head>
<body>
<button class="menu-btn" aria-expanded="false" aria-controls="ovl">Menu</button>
<div class="ovl" id="ovl" aria-hidden="true">
  <div class="layer l1"></div><div class="layer l2"></div>
  <nav aria-label="Main"></nav>
</div>
<section class="page"><h1 style="font-size:clamp(40px,7vw,90px);letter-spacing:-.04em;margin:0">Open the menu ↗</h1></section>

<script src="../../assets/demo.js"></script>
<script>
  const btn = document.querySelector(".menu-btn"), ovl = document.getElementById("ovl"), nav = ovl.querySelector("nav");
  ["Home", "Work", "Studio", "Journal", "Contact"].forEach((t, i) => nav.insertAdjacentHTML("beforeend", `<a href="#" style="--i:${i}"><span>${t}<sup>0${i + 1}</sup></span></a>`));
  const links = [...nav.querySelectorAll("a")];
  function set(open) {
    ovl.classList.toggle("open", open); ovl.setAttribute("aria-hidden", !open);
    btn.setAttribute("aria-expanded", open); btn.textContent = open ? "Close" : "Menu";
    links.forEach((a) => (a.tabIndex = open ? 0 : -1));
    if (open) setTimeout(() => links[0].focus(), 500);
  }
  btn.onclick = () => set(!ovl.classList.contains("open"));
  links.forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); set(false); btn.focus(); }));
  // Keep Tab inside the menu while open; Escape closes.
  addEventListener("keydown", (e) => {
    if (!ovl.classList.contains("open")) return;
    if (e.key === "Escape") { set(false); btn.focus(); }
    if (e.key === "Tab") {
      const f = [btn, ...links], i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  set(false);
</script>
</body>
</html>
